<!doctype html><html lang="zh"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>淘星TV</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📺</text></svg>">
<style>
  :root{--bg:#0d0f14;--panel:#151922;--panel2:#1b2130;--line:#232a3a;--txt:#e6e9ef;--dim:#8a93a6;--acc:#3b82f6;--acc2:#2563eb}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font:14px/1.5 -apple-system,"PingFang SC",system-ui,sans-serif;height:100vh;height:100dvh;overflow:hidden}
  .app{display:grid;grid-template-columns:340px 1fr;height:100vh;height:100dvh;transition:grid-template-columns .22s ease}
  .app.collapsed{grid-template-columns:0 1fr}
  .side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;overflow:hidden}
  .tabs{display:flex;border-bottom:1px solid var(--line)}
  .tabs button{flex:1;padding:15px 0;background:none;border:none;color:var(--dim);font-size:15px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent}
  .tabs button.on{color:var(--txt);border-bottom-color:var(--acc)}
  .search{padding:12px}
  .search input{width:100%;padding:10px 12px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--txt);outline:none}
  .search input:focus{border-color:var(--acc)}
  .downloadShortcut{padding:0 12px 8px}
  .downloadShortcut button{width:100%;padding:7px 10px;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:7px;color:var(--txt);cursor:pointer}
  .downloadShortcut button:hover{border-color:var(--acc)}
  .cats{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px 4px}
  .cats button{padding:5px 12px;background:var(--panel2);border:1px solid var(--line);border-radius:16px;color:var(--dim);font-size:13px;cursor:pointer}
  .cats button.on{background:var(--acc2);color:#fff;border-color:var(--acc2)}
  .list{flex:1;overflow-y:auto;padding:0 8px 12px}
  #liveBox,#vodBox{flex:1;display:flex;flex-direction:column;min-height:0}
  .row{display:flex;align-items:center;gap:10px;padding:8px 11px;border-radius:8px;cursor:pointer}
  .row:hover{background:var(--panel2)}
  .row.on{background:var(--acc2)}
  .row .idx{width:30px;color:var(--dim);font-variant-numeric:tabular-nums;font-size:12px;flex:none;text-align:center}
  .row .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .rk{color:var(--dim);font-size:12px;flex:none;max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row.on .rk,.row.on .idx{color:#cfe0ff}
  .sourcebar{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:4px 0 14px}
  .sourcebar:empty{display:none}
  .sourcebar button{padding:5px 12px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;color:var(--dim);cursor:pointer}
  .sourcebar button.on{background:var(--acc2);border-color:var(--acc);color:#fff}
  .thumb{width:38px;height:52px;flex:none;border-radius:4px;object-fit:cover;background:var(--panel2)}
  .logo{width:44px;height:34px;flex:none;object-fit:contain;background:#0a0c10;border-radius:4px}
  .thumb.noimg,.logo.noimg{visibility:hidden}
  .muted{padding:20px;color:var(--dim)}
  .retry{margin-top:10px;padding:6px 12px;background:var(--panel2);border:1px solid var(--line);border-radius:7px;color:var(--txt);cursor:pointer}
  .pager{display:flex;align-items:center;justify-content:center;gap:12px;padding:12px 4px;color:var(--dim);font-size:12px}
  .pager button{padding:5px 9px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;color:var(--txt);cursor:pointer}
  .pager button:disabled{opacity:.4;cursor:default}
  .main{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;background:#000;position:relative}
  .sideToggle{position:absolute;left:0;top:50%;transform:translateY(-50%);z-index:5;width:20px;height:64px;background:rgba(0,0,0,.45);color:#fff;border:none;border-radius:0 9px 9px 0;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;opacity:.28;transition:opacity .2s,background .2s}
  .sideToggle:hover{opacity:.95;background:rgba(0,0,0,.72)}
  .app:fullscreen .sideToggle,.app:-webkit-full-screen .sideToggle{opacity:0;pointer-events:none}   /* 全屏里把手只随控制栏出现,不常驻挡画面 */
  .app:fullscreen .stage.ui .sideToggle,.app:-webkit-full-screen .stage.ui .sideToggle,.app:fullscreen .stage:not(.vod):not(.live) .sideToggle{opacity:.85;pointer-events:auto}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:19;display:none}   /* 横屏手机抽屉打开时盖住画面,点一下收起 */
  .stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;background:#000;overflow:hidden}
  video{width:100%;height:100%;background:#000;object-fit:contain}
  .hint{position:absolute;color:var(--dim);font-size:15px;text-align:center;pointer-events:none}
  .load{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:rgba(0,0,0,.55);pointer-events:none;z-index:3}
  .load.show{display:flex}
  .spin{width:44px;height:44px;border:3px solid #2a3346;border-top-color:var(--acc);border-radius:50%;animation:s 1s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  .ptitle{position:absolute;top:0;left:0;right:0;padding:16px 20px;font-size:16px;font-weight:600;color:#fff;background:linear-gradient(180deg,rgba(0,0,0,.6),transparent);opacity:0;transition:opacity .2s;pointer-events:none;z-index:4}
  .stage.ui .ptitle{opacity:1}
  .pctl{position:absolute;left:0;right:0;bottom:0;padding:26px 18px 14px;background:linear-gradient(0deg,rgba(0,0,0,.72),transparent);display:flex;align-items:center;gap:12px;opacity:0;transition:opacity .2s;z-index:4;pointer-events:none}
  .stage.ui .pctl{opacity:1;pointer-events:auto}
  .app:fullscreen .stage:not(.ui) video{cursor:none}          /* 全屏且鼠标静止(控制栏已隐藏)时隐藏光标,不挡画面;一动就随控制栏一起回来 */
  .app:-webkit-full-screen .stage:not(.ui) video{cursor:none}
  .pbtn{height:40px;min-width:40px;padding:0 8px;border:none;background:transparent;color:#fff;font-size:19px;cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:8px;white-space:nowrap}
  .pbtn:hover{background:rgba(255,255,255,.15)}
  .pbtn.txt{font-size:14px}
  .pbtn.on{color:var(--acc);background:rgba(59,130,246,.18)}
  .moreWrap{position:relative;flex:none}
  .moreMenu{position:absolute;right:0;bottom:50px;background:#1b2130;border:1px solid var(--line);border-radius:10px;padding:6px;min-width:158px;display:none;box-shadow:0 8px 28px rgba(0,0,0,.55)}
  .moreMenu.show{display:block}
  .mitem{display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:7px;cursor:pointer;color:var(--txt);font-size:14px;white-space:nowrap}
  .mitem:hover{background:var(--panel2)}
  .mitem .chk{width:15px;color:var(--acc);visibility:hidden;font-weight:700}
  .mitem.on .chk{visibility:visible}
  .pbtn:disabled{color:#5a6273;cursor:default}
  .pbtn:disabled:hover{background:transparent}
  .tm{color:#e8ebf2;font-size:14px;font-variant-numeric:tabular-nums;flex:none;min-width:56px;text-align:center}
  .seekrow{flex:1;align-items:center;gap:12px;min-width:0}   /* 时间+进度条+总长 一组:窄屏时整组换到独立一行 */
  .seek{flex:1;min-width:80px;-webkit-appearance:none;height:6px;border-radius:3px;background:rgba(255,255,255,.28);outline:none;cursor:pointer}
  #seekTip{position:fixed;transform:translate(-50%,-100%);background:rgba(0,0,0,.88);color:#fff;font-size:14px;padding:4px 9px;border-radius:7px;pointer-events:none;z-index:12;display:none;font-variant-numeric:tabular-nums;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.5)}
  .seek::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:#fff;cursor:pointer;box-shadow:0 0 0 3px rgba(59,130,246,.45)}
  .volsl{width:88px;-webkit-appearance:none;height:5px;border-radius:3px;background:rgba(255,255,255,.28);outline:none;cursor:pointer}
  .volsl::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:#fff;cursor:pointer}
  .liveInd{color:#ff5a5a;font-size:14px;font-weight:600;flex:none}
  #speed{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:8px;padding:7px 10px;font-size:14px;cursor:pointer;flex:none}
  .vodOnly,.liveOnly{display:none}
  .stage.vod .vodOnly{display:flex}
  .stage.live .liveOnly{display:flex}
  select.vodOnly{display:none}.stage.vod select.vodOnly{display:inline-block}
  .volpop{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.7);color:#fff;padding:10px 18px;border-radius:10px;font-size:20px;font-weight:600;opacity:0;transition:opacity .25s;pointer-events:none;z-index:6}
  .volpop.show{opacity:1}
  .detail{position:absolute;inset:0;background:rgba(13,15,20,.97);z-index:8;display:none;padding:34px 44px;overflow-y:auto}
  .detail.show{display:block}
  .detail .head{display:flex;gap:34px;margin-bottom:28px}
  .detail .poster{width:270px;height:378px;flex:none;border-radius:12px;background:var(--panel2) center/cover no-repeat;box-shadow:0 4px 18px rgba(0,0,0,.4)}
  .detail h2{font-size:38px;margin-bottom:16px}
  .detail .meta{color:var(--dim);font-size:18px;margin-bottom:18px;line-height:2.0}
  .detail .desc{color:#c3cad8;font-size:18px;line-height:1.85;max-width:1000px}
  .detail .epstitle{color:var(--dim);font-size:18px;margin:14px 0 14px}
  .detail .eps{display:grid;gap:24px 12px}
  .detail .eps .epcell{position:relative;display:flex;gap:5px}
  .detail .eps .epcell .epplay{flex:1;min-width:0}
  .detail .eps .epcell .epqueue{width:auto;flex:none;padding:8px 10px;font-size:12px;color:#cfe0ff}
  .detail .eps .epcell .epqueue:disabled{opacity:.65;cursor:default}
  .detail .eps .epcell.last .epplay{border-color:var(--acc);background:#243049}
  .detail .eps .epcell.last::after{content:'上次看到';position:absolute;top:-11px;left:50%;transform:translateX(-50%);background:var(--acc);color:#fff;font-size:12px;font-weight:600;padding:2px 9px;border-radius:9px;white-space:nowrap;z-index:2;pointer-events:none;box-shadow:0 2px 6px rgba(0,0,0,.45)}
  .detail .eps button{padding:16px 16px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--txt);cursor:pointer;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .detail .eps button:hover{border-color:var(--acc);background:#243049}
  .detail .close{position:absolute;top:18px;right:22px;background:none;border:none;color:var(--dim);font-size:26px;cursor:pointer;z-index:9}
  .detail .downloadOpen{position:absolute;top:22px;right:68px;background:var(--panel2);border:1px solid var(--line);border-radius:7px;color:var(--txt);padding:7px 11px;cursor:pointer;z-index:9}
  .downloadPanel{position:absolute;inset:0;background:rgba(13,15,20,.98);z-index:11;display:none;padding:28px 34px;overflow-y:auto}
  .downloadPanel.show{display:block}
  .downloadPanel h2{font-size:25px;margin-bottom:10px}
  .downloadPanel .close{position:absolute;top:18px;right:22px;background:none;border:none;color:var(--dim);font-size:26px;cursor:pointer}
  .downloadPanel .note{color:var(--dim);margin-bottom:16px}
  .downloadActions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .downloadActions button{padding:9px 13px;background:var(--panel2);border:1px solid var(--line);border-radius:7px;color:var(--txt);cursor:pointer}
  .downloadActions button:hover{border-color:var(--acc)}
  .downloadDir{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:20px}
  .downloadDir input{flex:1;min-width:210px;padding:9px 11px;background:var(--panel2);border:1px solid var(--line);border-radius:7px;color:var(--txt)}
  .downloadDir button,.downloadJob button{padding:8px 11px;background:var(--panel2);border:1px solid var(--line);border-radius:7px;color:var(--txt);cursor:pointer}
  .downloadDir button:hover,.downloadJob button:hover{border-color:var(--acc)}
  .downloadError{min-height:20px;color:#ff8686;margin-bottom:8px}
  .downloadJob{padding:13px 0;border-top:1px solid var(--line);display:flex;align-items:center;gap:14px}
  .downloadJob .body{flex:1;min-width:0}
  .downloadJob .name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .downloadJob .status{color:var(--dim);font-size:12px;margin-top:3px;overflow-wrap:anywhere}
  .downloadJob progress{width:100%;height:5px;accent-color:var(--acc);margin-top:6px}
  #wake{position:fixed;inset:0;z-index:99;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px}
  #wake.hide{display:none}
  #wake .logo2{font-size:34px;font-weight:800}#wake .step{color:var(--dim);font-size:14px}
  #wake .prog{width:260px;height:4px;background:var(--panel2);border-radius:2px;overflow:hidden}
  #wake .prog i{display:block;height:100%;width:2%;background:var(--acc);border-radius:2px;transition:width .45s ease}
  #wakeProg{display:flex;flex-direction:column;align-items:center;gap:16px}
  #loginBox{display:flex;flex-direction:column;gap:12px;width:290px}
  #loginBox .lt{font-size:15px;color:var(--txt);text-align:center;margin-bottom:2px}
  #loginBox input{padding:12px 14px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--txt);font-size:15px}
  #loginBox input:focus{border-color:var(--acc);outline:none}
  #loginBox button{padding:12px;background:var(--acc);color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer}
  #loginBox button:disabled{opacity:.55;cursor:default}
  #liErr{color:#ff6b6b;font-size:13px;min-height:16px;text-align:center}
  @keyframes sl{0%{margin-left:-30%}100%{margin-left:100%}}
  /* ===== 手机/窄屏:DOM 不变,只用媒体查询改布局(和脚本里的 layoutMode() 一一对应) ===== */
  @media (pointer:coarse){
    *{-webkit-tap-highlight-color:transparent}
    .search input{font-size:16px}                 /* iOS:小于16px聚焦会自动放大页面 */
    .volsl,#volBtn{display:none!important}        /* 手机:音量走上下滑手势/实体键,不占控制栏 */
    .row{padding:10px 11px}
    .stage{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
    .sideToggle{opacity:0;pointer-events:none;width:26px;height:80px;font-size:20px}
    .stage.ui .sideToggle,.stage:not(.vod):not(.live) .sideToggle{opacity:.85;pointer-events:auto}   /* 把手只随控制栏出现(不常驻挡画面);还没播放时常显 */
  }
  @media (max-width:900px),(max-height:520px){     /* 窄屏/矮屏:控制栏两行(进度一行、按钮一行),详情弹层全屏且字号收小 */
    .pctl{flex-wrap:wrap;gap:0 4px;padding:10px 8px 6px}
    .seekrow{flex:1 1 100%;order:-1;gap:8px}
    .pbtn{height:34px;min-width:34px;padding:0 5px;font-size:17px}
    .pbtn.txt{font-size:13px}
    .tm{min-width:44px;font-size:13px}
    #speed{padding:4px 4px;font-size:13px;margin-left:auto}
    .ptitle{padding:10px 14px;font-size:14px}
    .detail{position:fixed;inset:0;z-index:30;padding:14px 14px 24px}
    .detail .head{gap:14px;margin-bottom:14px}
    .detail .poster{width:96px;height:134px;border-radius:8px}
    .detail h2{font-size:20px;margin-bottom:6px;padding-right:40px}
    .detail .meta{font-size:13px;line-height:1.6;margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}   /* 演员表很长:默认3行,点一下展开 */
    .detail .meta.open{display:block;-webkit-line-clamp:unset}
    .detail .desc{font-size:14px;line-height:1.6;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}   /* 简介默认4行,点一下展开 */
    .detail .desc.open{display:block;-webkit-line-clamp:unset}
    .detail .epstitle{font-size:14px;margin:10px 0}
    .detail .eps{gap:16px 8px}
    .detail .eps button{font-size:15px;padding:11px 8px;border-radius:8px}
    .detail .eps .epcell .epqueue{font-size:11px;padding:6px}
    .detail .downloadOpen{top:9px;right:50px;padding:5px 8px;font-size:12px}
    .downloadPanel{position:fixed;z-index:32;padding:16px 14px}
    .detail .close{top:6px;right:6px;font-size:24px;padding:6px 10px}
  }
  @media (orientation:portrait) and (max-width:760px){   /* 竖屏手机:上下堆叠——视频固定在顶部(16:9),节目栏占满下方;没有"收起侧栏"的概念 */
    .app,.app.collapsed{grid-template-columns:1fr;grid-template-rows:auto 1fr}
    .main{order:1;aspect-ratio:16/9;max-height:56vh;height:auto}
    .side{order:2;border-right:none;border-top:1px solid var(--line)}
    .sideToggle{display:none}
  }
  /* 抽屉模式(脚本按"横屏手机 或 全屏中"给 .app 加 drawer 类):视频铺满,节目栏变左侧抽屉——开始播放自动收起;点把手或从左边缘右滑拉出;点遮罩或在抽屉上左滑收起。
     竖屏常规模式不用它(保持上下堆叠),竖屏进了全屏才用。放在所有媒体查询之后以便覆盖堆叠规则 */
  .app.drawer,.app.drawer.collapsed{grid-template-columns:1fr;grid-template-rows:1fr}
  .app.drawer .main{order:0;aspect-ratio:auto;max-height:none}
  .app.drawer .side{position:fixed;top:0;bottom:0;left:0;width:min(380px,86%);z-index:20;box-shadow:4px 0 24px rgba(0,0,0,.5);transition:transform .22s ease;border-top:none;border-right:1px solid var(--line)}
  .app.drawer.collapsed .side{transform:translateX(-100%)}
  .app.drawer:not(.collapsed) .scrim{display:block}
  .app.drawer .tabs button{padding:10px 0}
  .app.drawer .sideToggle{display:flex}
</style></head><body>
<div id="wake"><div class="logo2">📺 淘星TV</div>
  <div id="wakeProg"><div class="prog"><i></i></div><div class="step" id="wstep">正在唤醒…</div></div>
  <div id="loginBox" style="display:none">
    <div class="lt">登录淘星TV账号</div>
    <input id="liAccount" placeholder="账号" autocomplete="username">
    <input id="liPassword" type="password" placeholder="密码" autocomplete="current-password">
    <button id="liBtn" onclick="doLogin()">登录</button>
    <div id="liErr"></div>
  </div>
</div>
<div class="app">
  <aside class="side">
    <div class="tabs"><button id="tabLive" class="on" onclick="switchTab('live')">直播</button><button id="tabVod" onclick="switchTab('vod')">点播</button></div>
    <div id="liveBox"><div class="search"><input id="q" placeholder="搜索频道…"></div><div class="list" id="listLive"></div></div>
    <div id="vodBox" style="display:none"><div class="search"><input id="vq" placeholder="搜索片名或拼音首字母…"></div><div class="downloadShortcut"><button id="downloadShortcut" onclick="openDownloads()">下载队列</button></div><div class="cats" id="cats"></div><div class="list" id="listVod"></div></div>
  </aside>
  <section class="main">
    <div class="stage" id="stage">
      <button class="sideToggle" id="sideTgl" onclick="toggleSide()" title="收起/展开节目栏">‹</button>
      <video id="v" playsinline></video>
      <div class="hint" id="hint">← 从左侧选一个频道开始观看</div>
      <div class="ptitle" id="ptitle"></div>
      <div class="volpop" id="volpop"></div>
      <div class="load" id="load"><div class="spin"></div><div id="loadtx">正在连接…</div></div>
      <div class="pctl" id="pctl">
        <button class="pbtn" id="ppBtn" title="播放/暂停(空格)">▶</button>
        <button class="pbtn txt vodOnly" id="prevBtn" title="上一集">⏮</button>
        <button class="pbtn txt vodOnly" id="nextBtn" title="下一集">⏭</button>
        <div class="seekrow vodOnly"><span class="tm" id="curT">0:00</span>
        <input type="range" class="seek" id="seek" min="0" max="1000" value="0"><div id="seekTip"></div>
        <span class="tm" id="totT">0:00</span></div>
        <span class="liveInd liveOnly" id="liveInd">● 直播中</span>
        <span style="flex:1" class="liveOnly"></span>
        <button class="pbtn" id="volBtn" title="静音">🔊</button>
        <input type="range" class="volsl" id="vol" min="0" max="1" step="0.05" value="1">

        <div class="downloadActions"><button id="stopForDownloads" style="display:none" onclick="stopPlaybackForDownloads()">停止播放并开始下载</button><button id="resumeAfterDownloads" style="display:none" onclick="resumeStoppedPlayback()">继续观看</button></div>

<script src="mpegts.js"></script>
<script>
let channels=[], cats=[], films=[], player=null, curId=null, mode='live', reqSeq=0, curCat=null, curPage=1, curPages=1, filmsCache={};
let curFilm=null, curEps=[], curEpIdx=0, vodBase=0, vodDur=0, dragging=false, curSpeed=1, isLiveNow=false, curPct=0, switching=false;
const $=id=>document.getElementById(id);
const startupQuery=new URLSearchParams(location.search), pauseOnce=startupQuery.has('pauseOnce'), stopForDownloadsOnce=startupQuery.has('stopForDownloadsOnce');
if(pauseOnce || stopForDownloadsOnce){ startupQuery.delete('pauseOnce'); startupQuery.delete('stopForDownloadsOnce'); const rest=startupQuery.toString(); history.replaceState(null,'',location.pathname+(rest?'?'+rest:'')+location.hash); }
// —— 唤醒进度条(按启动步骤+耗时填充,不显示数字) ——
let wakeStart=Date.now(), wakeStep='', wakeIv=null;
function setWakeProg(p){ const el=document.querySelector('#wake .prog i'); if(el) el.style.width=Math.max(2,Math.min(100,p))+'%'; }
function bootPct(){ const map=[['启动模拟器',8],['系统就绪',35],['取流引擎',50],['冷重启',55],['P2P',68],['注入',86],['就绪',90]]; let p=5; if(wakeStep)for(const kv of map){ if(wakeStep.indexOf(kv[0])>=0){ p=kv[1]; break; } } return Math.max(p, Math.min(88,(Date.now()-wakeStart)/46000*100)); }  // 步骤里程碑 与 按~46s匀速爬 取大者,总在动
function startWakeProg(){ wakeStart=Date.now(); wakeStep=''; if(wakeIv)clearInterval(wakeIv); wakeIv=setInterval(()=>setWakeProg(bootPct()),300); }
function stopWakeProg(){ if(wakeIv){clearInterval(wakeIv);wakeIv=null;} }
const jget=async(u,o)=>{ const r=await fetch(u,o); if(!r.ok){ let m=''; try{m=(await r.json()).error||'';}catch(e){} throw new Error('HTTP '+r.status+(m?': '+m:'')); } return r.json(); };
const V=$('v'), STAGE=$('stage');
// —— 布局模式:stack=竖屏上下堆叠(纯媒体查询) / drawer=抽屉(横屏手机,或任何设备全屏中;脚本给 .app 加 drawer 类) / desk=桌面两列 ——
const APP=document.querySelector('.app');
const MQ_STACK=matchMedia('(orientation:portrait) and (max-width:760px)'), MQ_DRAWER=matchMedia('(orientation:landscape) and (max-height:520px)');
const isTouch=matchMedia('(pointer:coarse)').matches || location.search.indexOf('touch=1')>=0;   // touch=1:桌面浏览器调试手势用
function layoutMode(){ return MQ_STACK.matches?'stack':(MQ_DRAWER.matches?'drawer':'desk'); }
function inDrawer(){ return APP.classList.contains('drawer'); }
function applyLayout(){ APP.classList.toggle('drawer', layoutMode()==='drawer' || !!fsEl()); updHint(); }   // 全屏中一律抽屉:视频铺满,节目栏从左侧拉出
function onMQ(mq,fn){ if(mq.addEventListener) mq.addEventListener('change',fn); else mq.addListener(fn); }
function updHint(){ const m=inDrawer()?'drawer':layoutMode(); $('hint').textContent = m==='stack' ? '↓ 从下方选一个频道开始观看' : (m==='drawer' ? '‹ 点左侧把手打开节目栏' : '← 从左侧选一个频道开始观看'); }
onMQ(MQ_STACK,applyLayout); onMQ(MQ_DRAWER,e=>{ applyLayout(); if(e.matches&&player) setSide(true); });   // 转成横屏时正在播放:抽屉自动收起,别盖住画面
applyLayout();
const fmt=s=>{s=Math.max(0,Math.floor(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=s%60;return (h?h+':':'')+(h?String(m).padStart(2,'0'):m)+':'+String(ss).padStart(2,'0');};
const LS={get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let downloadState={directory:'',jobs:[]};
let playbackStoppedForDownload=false;
const downloadLabels={queued:'排队中',waiting:'等待停止播放',downloading:'下载中',done:'已完成',failed:'失败',cancelled:'已取消'};
async function refreshDownloads(){
  try{ downloadState=await jget('api/downloads'); renderDownloads(); }
  catch(e){ if($('downloadPanel').classList.contains('show')) $('downloadError').textContent=e.message||'队列加载失败'; }
}
function queueJobFor(playid,index){ return downloadState.jobs.find(j=>j.playid===playid&&j.episodeIndex===index&&!['cancelled','failed'].includes(j.status)); }
function syncEpisodeDownloadButtons(){
  document.querySelectorAll('.epqueue').forEach(b=>{
    const job=queueJobFor(b.dataset.playid,Number(b.dataset.index));
    b.textContent=job?(job.status==='done'?'已下载':'已入队'):'下载';
    b.disabled=!!job;
  });
}
function renderDownloads(){
  const pending=downloadState.jobs.filter(j=>['queued','waiting','downloading'].includes(j.status)).length;
  $('downloadShortcut').textContent='下载队列'+(pending?' · '+pending:'');
  $('stopForDownloads').style.display=pending && player ? '' : 'none';
  $('resumeAfterDownloads').style.display=playbackStoppedForDownload && !player ? '' : 'none';
  $('resumeAfterDownloads').textContent=downloadState.jobs.some(j=>j.status==='downloading')?'继续观看（暂停下载）':'继续观看';
  syncEpisodeDownloadButtons();
  if(!$('downloadPanel').classList.contains('show')) return;
  if(document.activeElement!==$('downloadDirectory')) $('downloadDirectory').value=downloadState.directory||'';
  const list=$('downloadJobs'); list.replaceChildren();
  if(!downloadState.jobs.length){ const empty=document.createElement('p'); empty.className='muted'; empty.textContent='队列为空。在节目选集旁点击“下载”即可加入。'; list.appendChild(empty); return; }
  for(const job of downloadState.jobs){
    const row=document.createElement('div'); row.className='downloadJob';
    const body=document.createElement('div'); body.className='body';
    const name=document.createElement('div'); name.className='name'; name.textContent=job.title+' · '+job.playname;
    const status=document.createElement('div'); status.className='status';
    const progress=Math.min(100,Math.round(100*((job.completedSec||0)+(job.currentSec||0))/(job.episode?.duration||1)));
    status.textContent=(downloadLabels[job.status]||job.status)+(job.status==='done'?' · '+job.output:job.status==='failed'?' · '+(job.error||'请重试'):' · '+progress+'%');
    body.append(name,status);
    if(['downloading','queued','waiting'].includes(job.status)){
      const bar=document.createElement('progress'); bar.max=100; bar.value=progress; body.appendChild(bar);
    }
    row.appendChild(body);
    if(['queued','waiting','downloading','failed','cancelled'].includes(job.status)){
      const action=document.createElement('button'); action.textContent=['failed','cancelled'].includes(job.status)?'重试':'取消';
      action.onclick=async()=>{ action.disabled=true; try{
        await jget('api/downloads/'+encodeURIComponent(job.id)+'/'+(['failed','cancelled'].includes(job.status)?'retry':'cancel'),{method:'POST'});
        $('downloadError').textContent=''; await refreshDownloads();
      }catch(e){ $('downloadError').textContent=e.message||'操作失败'; action.disabled=false; } };
      row.appendChild(action);
    }
    if(job.status==='cancelled'){
      const remove=document.createElement('button'); remove.textContent='移除';
      remove.onclick=async()=>{ remove.disabled=true; try{
        await jget('api/downloads/'+encodeURIComponent(job.id),{method:'DELETE'});
        $('downloadError').textContent=''; await refreshDownloads();
      }catch(e){ $('downloadError').textContent=e.message||'移除失败'; remove.disabled=false; } };
      row.appendChild(remove);
    }
    list.appendChild(row);
  }
}
function openDownloads(){ $('downloadPanel').classList.add('show'); $('downloadError').textContent=''; refreshDownloads(); }
function closeDownloads(){ $('downloadPanel').classList.remove('show'); }
function showStoppedForDownloads(){
  $('ptitle').textContent=curFilm ? curFilm.title+' · '+(curEps[curEpIdx]?.playname||'') : '直播已停止';
  $('load').classList.remove('show'); $('hint').style.display='block';
  $('hint').textContent='播放已停止，下载队列会自动开始';
  STAGE.classList.remove('ui'); renderDownloads();
}
async function stopPlaybackForDownloads(){
  if(!player) return;
  const sid=activeStreamSid;
  saveState();
  const saved=LS.get('txtv_state',null);
  if(saved){ saved.stoppedForDownload=true; LS.set('txtv_state',saved); }
  playbackStoppedForDownload=true; activeStreamSid=''; pendingResumeAt=0; pendingStartPaused=false;
  cancelRecovery(); clearWaitTimer();
  const old=player; player=null;
  try{ old.destroy(); }catch(e){}
  try{ V.pause(); }catch(e){}
  showStoppedForDownloads();
  try{ await jget('api/leave?sid='+encodeURIComponent(sid),{method:'POST'}); $('downloadError').textContent=''; }
  catch(e){ $('downloadError').textContent='释放播放资源失败：'+(e.message||e); }
  await refreshDownloads();
}
function resumeStoppedPlayback(){
  if(!playbackStoppedForDownload) return;
  if(!curFilm){
    const c=channels.find(x=>x.channelId===curId) || LS.get('txtv_state',null)?.live;
    if(!c) return;
    playbackStoppedForDownload=false; closeDownloads(); playLive(c); return;
  }
  if(!curEps[curEpIdx]) return;
  const saved=LS.get('txtv_state',null)?.vod;
  const pctValue=Number(saved?.percent)||0, pct=Math.max(0,Math.min(96,Math.floor(pctValue)));
  const target=vodDur ? Math.max(0,pctValue/100*vodDur) : 0;
  const base=vodDur ? Math.floor(pct/100*vodDur) : 0;
  pendingResumeAt=target-base>3?target:0; pendingMargin=resumeMargin(target); pendingStartPaused=false;
  playbackStoppedForDownload=false;
  closeDownloads(); playEpisode(pct);
}
async function saveDownloadDirectory(){
  try{ downloadState=await jget('api/downloads/directory',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({directory:$('downloadDirectory').value})});
    $('downloadError').textContent=''; renderDownloads();
  }catch(e){ $('downloadError').textContent=e.message||'目录不可用'; }
}
async function enqueueEpisode(playid,index,button){
  button.disabled=true; button.textContent='添加中…';
  try{ await jget('api/downloads',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({playid,episodeIndex:index})});
    await refreshDownloads();
  }catch(e){ button.disabled=false; button.textContent='下载'; openDownloads(); $('downloadError').textContent=e.message||'加入队列失败'; }
}
refreshDownloads();
setInterval(()=>{if(!document.hidden)refreshDownloads();},5000);
filmsCache=LS.get('txtv_native_pages_v1',{});
const DETAIL_FRESH_MS=5*60*1000, DETAIL_STALE_MS=24*60*60*1000;
let detailCache=LS.get('txtv_details_v1',{}), searchCache=LS.get('txtv_search_v1',{});
const detailRequests=new Map();
function cachedDetail(playid){ const c=detailCache[playid]; return c?.data?.film && Array.isArray(c.data.episodes) && Date.now()-c.at<DETAIL_STALE_MS ? c : null; }
function rememberDetail(playid,d){
  delete detailCache[playid]; detailCache[playid]={at:Date.now(),data:d};
  while(Object.keys(detailCache).length>24) delete detailCache[Object.keys(detailCache)[0]];
  LS.set('txtv_details_v1',detailCache);
}
function requestDetail(playid){
  const c=cachedDetail(playid);
  if(c && Date.now()-c.at<DETAIL_FRESH_MS) return Promise.resolve(c.data);
  if(detailRequests.has(playid)) return detailRequests.get(playid);
  const p=jget('api/vod/detail?playid='+encodeURIComponent(playid)).then(d=>{
    if(!d?.film || !Array.isArray(d.episodes)) throw new Error('选集数据无效');
    rememberDetail(playid,d); return d;
  }).finally(()=>detailRequests.delete(playid));
  detailRequests.set(playid,p); return p;
}
function cachedSearch(q){ const c=searchCache['q:'+q]; return c?.data?.films && Date.now()-c.at<60*60*1000 ? c : null; }
function rememberSearch(q,d){
  if(!d.complete || d.partial) return;
  delete searchCache['q:'+q]; searchCache['q:'+q]={at:Date.now(),data:d};
  while(Object.keys(searchCache).length>12) delete searchCache[Object.keys(searchCache)[0]];
  LS.set('txtv_search_v1',searchCache);
}
let prefetchGeneration=0, prefetchTimer=null;
function prefetchDetail(f){ const selected=f.sources?.[0]||f; if(selected?.playid) requestDetail(selected.playid).catch(()=>{}); }
function scheduleDetailPrefetch(list){
  const generation=++prefetchGeneration; clearTimeout(prefetchTimer);
  // 只暖首屏前三项，逐个请求；切换分类或点开详情立即停止后续预取。
  prefetchTimer=setTimeout(async()=>{
    for(const f of list.slice(0,3)){
      if(generation!==prefetchGeneration) break;
      const selected=f.sources?.[0]||f;
      if(selected?.playid && !cachedDetail(selected.playid)) await requestDetail(selected.playid).catch(()=>{});
    }
  },400);
}

async function bootOnce(){ startWakeProg();
  let st=await jget('api/status');
  if(st.state!=='ready'){ await fetch('api/wake',{method:'POST'});
    let ok=false;
    for(let i=0;i<90;i++){ await new Promise(r=>setTimeout(r,1200)); try{st=await jget('api/status');}catch(e){continue;}
      wakeStep=st.step||''; $('wstep').textContent=st.step||'正在唤醒引擎…';
      if(st.state==='ready'){ok=true;break;} if(st.step&&st.step.startsWith('启动失败')) throw new Error(st.step); }
    if(!ok) throw new Error('唤醒超时'); }
  stopWakeProg(); setWakeProg(92); $('wstep').textContent='检查登录…';
  let ls; try{ ls=await jget('api/loginstate'); }catch(e){ ls={loggedIn:false,hasSavedCreds:false}; }
  if(!ls.loggedIn){
    if(ls.hasSavedCreds){ $('wstep').textContent='自动登录中…'; setWakeProg(95); const r=await loginRequest({useSaved:true}); if(!r.ok){ showLogin(r.error||'自动登录失败，请重新登录'); return; } }
    else { showLogin(''); return; }
  }
  await afterLogin();
}
// 刷新后"出节目"是唯一可接受结果:任何瞬时失败(冷启动刚就绪被空闲回收抢到、网络抖动、引擎未就位)都自动重连,不再一失败就停在"请刷新"
let bootTries=0;
async function boot(){ try{ await bootOnce(); bootTries=0; }
  catch(e){ const authTimeout=String(e.message||e).includes('设备授权超时'); const limit=authTimeout?2:8;
    if(bootTries++ < limit){ $('wstep').textContent=(authTimeout?'设备授权超时':'引擎未就绪')+'，重连中…（'+bootTries+'）'; setTimeout(boot,2000); }
    else { stopWakeProg(); $('wstep').textContent='连接失败：'+(e.message||e); } }
}
async function afterLogin(){
  const d=await jget('api/channels');
  if(d.error) throw new Error('引擎未就位: '+d.error);
  channels=d.live||[]; window.expiredTime=d.expiredTime||'';
  stopWakeProg(); setWakeProg(100); $('wake').classList.add('hide'); startHeartbeat(); restore();
}
function showLogin(err){ $('wakeProg').style.display='none'; $('loginBox').style.display='flex'; $('liErr').textContent=err||''; $('liBtn').disabled=false; $('liBtn').textContent='登录'; startHeartbeat(); }
async function loginRequest(body){
  try{ const r=await fetch('api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); return await r.json(); }
  catch(e){ return {ok:false,error:'网络错误'}; }
}
async function doLogin(){
  const account=$('liAccount').value.trim(), password=$('liPassword').value.trim();
  if(!account||!password){ $('liErr').textContent='请输入账号和密码'; return; }
  $('liBtn').disabled=true; $('liBtn').textContent='连接应用服务器中…'; $('liErr').textContent='';
  const r=await loginRequest({account,password});
  if(r.ok){ $('loginBox').style.display='none'; $('wakeProg').style.display=''; $('wstep').textContent='登录成功，加载中…'; await afterLogin(); }
  else { $('liErr').textContent=r.error||'登录失败'; $('liBtn').disabled=false; $('liBtn').textContent='登录'; }
}
['liAccount','liPassword'].forEach(id=>{ const el=$(id); if(el) el.addEventListener('keydown',e=>{ if(e.key==='Enter') doLogin(); }); });
// —— 状态持久化 ——
// —— 观看进度:每个节目(playid)只存一条 {ep:最后看的那一集, pct:该集的时刻%}。换集=刷新覆盖,不为每集单独存 ——
function getProg(){ return LS.get('txtv_prog',{}); }
function saveProg(playid, ep, pct){ if(playid==null) return; const all=getProg(); all[playid]={ep:ep, pct:(pct>=0?pct:0)}; LS.set('txtv_prog',all); }
function resumePctFor(playid, ep){ const p=getProg()[playid]; if(!p||p.ep!==ep) return 0;   // 只有点的正是"最后看的那一集"才续播;别的集从头
  if(p.pct==null||p.pct<1||p.pct>=95) return 0; return Math.min(96,Math.floor(p.pct)); }       // 几乎没看/已看完 => 从头
function saveState(){ const s={tab:mode};
  if(playbackStoppedForDownload){ const prev=LS.get('txtv_state',null); if(prev?.vod) s.vod=prev.vod; else if(prev?.live) s.live=prev.live; s.stoppedForDownload=true; LS.set('txtv_state',s); return; }
  if(curFilm){ const pct=vodDur?(Math.max(pendingResumeAt||0,vodBase+V.currentTime)/vodDur*100):0; s.vod={film:curFilm,eps:curEps,idx:curEpIdx,dur:vodDur,percent:pct,paused:V.paused&&!pendingResumeAt};
    if(!isLiveNow && curFilm.playid!=null) saveProg(curFilm.playid, curEpIdx, pct); }
  else if(curId&&isLiveNow){ const c=channels.find(x=>x.channelId===curId); if(c)s.live={id:c.channelId,link:c.link,name:c.name,index:c.index}; }
  LS.set('txtv_state',s); }
async function restore(){ const s=LS.get('txtv_state',null);
  if(!s){ renderChannels(channels); return; }
  if(s.vod&&s.vod.film){ curCat='recent'; deferredCatsRefresh=true; const savedCats=LS.get('txtv_native_cats_v1',null);
    if(!cats.length && Array.isArray(savedCats)) cats=savedCats;
    renderCats(); switchTab('vod',true); showRecent(); curFilm=s.vod.film; curEps=s.vod.eps||[]; curEpIdx=s.vod.idx||0; vodDur=s.vod.dur||0;
    if(curEps[curEpIdx] && (stopForDownloadsOnce || s.stoppedForDownload || s.vod.stoppedForDownload)){
      playbackStoppedForDownload=true; s.stoppedForDownload=true; LS.set('txtv_state',s);
      showStoppedForDownloads(); if(stopForDownloadsOnce) openDownloads(); return;
    }
    if(curEps[curEpIdx]){ const savedPct=Number(s.vod.percent)||0, pct=Math.max(0,Math.min(96,Math.floor(savedPct||resumePctFor(curFilm.playid,curEpIdx))));
      const target=vodDur?Math.max(0,savedPct/100*vodDur):0, base=vodDur?Math.floor(pct/100*vodDur):0;
      pendingResumeAt=target-base>3?target:0; pendingMargin=resumeMargin(target); pendingStartPaused=pauseOnce||!!s.vod.paused;
      fromRecovery=true; try{ playEpisode(pct); }finally{ fromRecovery=false; } } }
  else if(s.live&&s.live.id){ switchTab('live');
    if(stopForDownloadsOnce || s.stoppedForDownload){ curId=s.live.id; isLiveNow=true; playbackStoppedForDownload=true; s.stoppedForDownload=true; LS.set('txtv_state',s); showStoppedForDownloads(); if(stopForDownloadsOnce) openDownloads(); }
    else playLive({channelId:s.live.id,link:s.live.link,name:s.live.name,index:s.live.index}); }
  else { switchTab(s.tab||'live'); }
}
// —— 最近播放 ——
function pushRecent(item){ let r=LS.get('txtv_recent',[]); r=r.filter(x=>x.key!==item.key); r.unshift(item); r=r.slice(0,24); LS.set('txtv_recent',r); }
function getRecent(){ return LS.get('txtv_recent',[]); }
function switchTab(m,deferCats=false){ mode=m; closeDetail(); saveState();

V.addEventListener('pause',()=>{ if(player)STAGE.classList.add('ui'); if(player&&isLiveNow)livePauseStartedAt=Date.now(); });
// —— 单击暂停 / 双击全屏 ——
let clickTimer=null;
STAGE.addEventListener('click',e=>{ if(e.target.closest('.pctl')||e.target.closest('.detail')||e.target.closest('.ptitle')||e.target.closest('.sideToggle'))return;
  if(clickTimer){clearTimeout(clickTimer);clickTimer=null;return;}
  clickTimer=setTimeout(()=>{ clickTimer=null; if(player) togglePP(); },230); });
STAGE.addEventListener('dblclick',e=>{ if(e.target.closest('.pctl')||e.target.closest('.detail')||e.target.closest('.sideToggle'))return; toggleFS(); });
// —— 手机手势(仅触屏):单击=暂停/播放(并显示控制栏)  左/右半屏双击=∓15秒(连点累加)
//    横向拖=拖进度(松手才取流)  纵向拖=音量  横屏抽屉模式从左边缘右滑=打开节目栏 ——
if(isTouch){
  let tS=null, tapT=0, tapTimer=null;   // tS:本次触摸 {x,y,t,mode,pos,vol,rect,target}
  const noGesture=el=>el.closest('.pctl')||el.closest('.detail')||el.closest('.sideToggle')||el.closest('.ptitle');
  STAGE.addEventListener('touchstart',e=>{ if(e.touches.length!==1||noGesture(e.target)){ tS=null; return; }
    const t=e.touches[0]; tS={x:t.clientX,y:t.clientY,t:Date.now(),mode:null,pos:vodBase+V.currentTime,vol:curVol,rect:STAGE.getBoundingClientRect(),target:null}; },{passive:true});
  STAGE.addEventListener('touchmove',e=>{ if(!tS) return; const t=e.touches[0]; const dx=t.clientX-tS.x, dy=t.clientY-tS.y;
    if(!tS.mode){ if(Math.hypot(dx,dy)<12) return;
      if(inDrawer() && tS.x-tS.rect.left<28 && dx>0){ tS.mode='drawer'; setSide(false); }   // 左边缘右滑:拉出抽屉
      else if(!player) tS.mode='none';
      else if(Math.abs(dx)>Math.abs(dy)) tS.mode=(isLiveNow||!vodDur)?'none':'seek';
      else tS.mode='vol'; }
    if(tS.mode==='seek'){ const target=Math.max(0,Math.min(vodDur-1, tS.pos + dx/tS.rect.width*240));   // 整个屏宽=4分钟
      tS.target=target; dragging=true; $('seek').value=target; $('curT').textContent=fmt(target); updateSeekBar(); flashUI();
      const d=target-tS.pos; pop((d>=0?'⏩ +':'⏪ −')+fmt(Math.abs(d))+'   '+fmt(target),1500); }
    else if(tS.mode==='vol'){ setVolAbs(tS.vol - dy/(tS.rect.height*0.7)); }   // 上滑变大:7成屏高=0→100%
    e.preventDefault(); },{passive:false});
  STAGE.addEventListener('touchend',e=>{ if(!tS) return; const s=tS; tS=null; e.preventDefault();   // 阻止浏览器再合成 click/dblclick(桌面那套点击逻辑不重复触发)
    if(s.mode==='seek'){ dragging=false; if(s.target!=null) commitSeek(s.target); return; }
    if(s.mode) return;                                   // 音量/抽屉/无效拖动:结束即可
    if(Date.now()-s.t>350) return;                       // 长按:不动作
    const now=Date.now(), x=e.changedTouches[0].clientX-s.rect.left;
    if(now-tapT<320){ tapT=now; clearTimeout(tapTimer); tapTimer=null;   // 双击/连点:按落点在左/右半屏决定方向,连点累加(seekBy 自带合并,停手后一次取流)
      if(player&&!isLiveNow&&vodDur){ seekBy(x<s.rect.width/2?-15:15); const d=seekTarget-(vodBase+V.currentTime); pop((d>=0?'⏩ +':'⏪ −')+fmt(Math.abs(d)),900); }
      return; }
    tapT=now; clearTimeout(tapTimer);
    tapTimer=setTimeout(()=>{ tapTimer=null; if(player){ togglePP(); flashUI(); } },320); },{passive:false});   // 单击:等320ms确认不是双击,再暂停/播放
  STAGE.addEventListener('touchcancel',()=>{ if(tS&&tS.mode==='seek'){ dragging=false; updateSeekBar(); } tS=null; },{passive:true});
  // 抽屉上左滑 -> 收起(竖屏全屏时抽屉占86%宽,旁边的遮罩条很窄,左滑更顺手)
  let dS=null; const SIDE=document.querySelector('.side');
  SIDE.addEventListener('touchstart',e=>{ dS=(e.touches.length===1&&inDrawer())?{x:e.touches[0].clientX,y:e.touches[0].clientY}:null; },{passive:true});
  SIDE.addEventListener('touchmove',e=>{ if(!dS) return; const dx=e.touches[0].clientX-dS.x, dy=e.touches[0].clientY-dS.y;
    if(dx<-50 && Math.abs(dx)>Math.abs(dy)*1.5){ dS=null; setSide(true); } },{passive:true});
}
// —— 控件 ——
function togglePP(){ if(!player)return; if(V.paused){
    const ahead=V.buffered.length?V.buffered.end(V.buffered.length-1)-V.currentTime:0;
    // 直播暂停太久后 MSE 会积满旧内容；从旧位置续播可能导致音画异常或反复缓冲。
    // 超出直播延迟窗口就重新取当前流，短暂停仍可从原处继续。
    if(isLiveNow && ((livePauseStartedAt&&Date.now()-livePauseStartedAt>30000)||ahead>30)){
      startPlay(window.playTitle||$('ptitle').textContent,window.curUrl,true); $('loadtx').textContent='回到直播…'; livePauseStartedAt=0; return;
    }
    V.play();
  }else V.pause(); }
$('ppBtn').onclick=togglePP;
V.addEventListener('play',()=>{$('ppBtn').textContent='⏸';});
V.addEventListener('pause',()=>{$('ppBtn').textContent='▶'; if(curFilm&&!isLiveNow)saveState();});
$('speed').onchange=e=>{ curSpeed=parseFloat(e.target.value); V.playbackRate=curSpeed; };
$('fsBtn').onclick=toggleFS;
function fsEl(){ return document.fullscreenElement||document.webkitFullscreenElement||null; }
async function enterFS(){   // 返回是否进入了全屏
  // 全屏的是整个 .app 而不是 .stage:这样全屏里节目栏还在(收成抽屉),不用退出全屏就能换台/换集
  try{ if(APP.requestFullscreen){ await APP.requestFullscreen({navigationUI:'hide'}); return true; }
       if(APP.webkitRequestFullscreen){ APP.webkitRequestFullscreen(); return true; } }catch(e){ console.warn('fullscreen',e); }
  try{ if(V.webkitEnterFullscreen){ V.webkitEnterFullscreen(); return true; } }catch(e){}   // 老 iPhone Safari 不支持元素全屏:退回视频原生全屏
  return false; }
function exitFS(){ try{ if(document.exitFullscreen) document.exitFullscreen(); else if(document.webkitExitFullscreen) document.webkitExitFullscreen(); }catch(e){} }
function toggleFS(){ if(fsEl()) exitFS(); else enterFS(); }
// 手机的横/竖屏全屏:⛶=全屏但跟随手机当前方向(竖着拿就是竖屏全屏);"横屏"=全屏并锁定横屏,再按切成锁定竖屏;退出全屏即解锁。
// iOS 没有方向锁定 API(按钮不显示),靠旋转手机。
const canLockOrient=!!(screen.orientation&&screen.orientation.lock);
let orientLock='';
if(isTouch&&canLockOrient) $('rotBtn').style.display='';
async function toggleOrient(){ const want=orientLock==='landscape'?'portrait':'landscape';
  if(!fsEl() && !(await enterFS())) return;
  try{ await screen.orientation.lock(want); orientLock=want; }
  catch(e){ console.warn('orientation lock',e); orientLock=''; pop('请旋转手机(并关闭方向锁定)',1500); }
  $('rotBtn').textContent=orientLock==='landscape'?'竖屏':'横屏'; }
$('rotBtn').onclick=toggleOrient;
let sideBeforeFS=false;
function onFSChange(){ const on=!!fsEl(); $('fsBtn').textContent=on?'🗗':'⛶';
  if(on){ sideBeforeFS=APP.classList.contains('collapsed'); applyLayout(); setSide(true); }   // 进全屏:视频铺满,节目栏收成抽屉(点把手/左缘右滑拉出)
  else { applyLayout(); setSide(layoutMode()==='desk' ? sideBeforeFS : (layoutMode()==='drawer' && !!player));   // 退出:桌面恢复进全屏前的开合;横屏手机播放中保持收起;竖屏堆叠不受 collapsed 影响
    orientLock=''; $('rotBtn').textContent='横屏'; try{ screen.orientation.unlock(); }catch(e){} } }
document.addEventListener('fullscreenchange',onFSChange); document.addEventListener('webkitfullscreenchange',onFSChange);
// iOS 不允许网页改 video.volume(设了读回来仍是1):那就改 Web Audio 链路末端的总增益,效果一样
const volumeSettable=(()=>{ try{ const o=V.volume; V.volume=0.37; const ok=Math.abs(V.volume-0.37)<0.01; V.volume=o; return ok; }catch(e){ return false; } })();
let curVol=1;
// 调试用 ?silent=1：刷新或自动恢复播放前先静音，不改变日常访问的音量设置。
const debugSilent=new URLSearchParams(location.search).get('silent')==='1';
if(debugSilent) V.muted=true;
function applyVol(v){ curVol=Math.max(0,Math.min(1,+(+v).toFixed(2))); V.muted=false;
  if(volumeSettable) V.volume=curVol; else { initAudioOnce(); if(masterGain) masterGain.gain.value=curVol; }
  $('vol').value=curVol; updVolIcon(); }
function pop(text,ms){ const p=$('volpop'); p.textContent=text; p.classList.add('show'); clearTimeout(p._t); p._t=setTimeout(()=>p.classList.remove('show'),ms||700); }
$('vol').addEventListener('input',e=>{ applyVol(parseFloat(e.target.value)); V.muted=curVol===0; updVolIcon(); });
$('volBtn').onclick=()=>{ V.muted=!V.muted; $('vol').value=V.muted?0:curVol; updVolIcon(); };
function updVolIcon(){ $('volBtn').textContent=(V.muted||curVol===0)?'🔇':(curVol<0.5?'🔉':'🔊'); }
updVolIcon();
function setVolAbs(v){ applyVol(v); pop('🔊 '+Math.round(curVol*100)+'%'); }
function setVol(delta){ setVolAbs(curVol+delta); }
let saveTimer=null, lastSave=0;
function updateSeekBar(){ if(isLiveNow||!curFilm)return; const dur=vodDur||1;
  const cur=dragging?parseFloat($('seek').value||0):(vodBase+V.currentTime);
  const played=Math.max(0,Math.min(100,cur/dur*100));
  const buf=Math.max(played,Math.min(100,(vodBase+bufferedEndAt(cur-vodBase))/dur*100));
  // 蓝=已播放 / 白=已缓冲未播 / 灰=未缓冲
  $('seek').style.background='linear-gradient(to right, var(--acc) 0 '+played+'%, rgba(255,255,255,.9) '+played+'% '+buf+'%, rgba(255,255,255,.28) '+buf+'% 100%)'; }
function bufferedEndAt(t){
  for(let i=0;i<V.buffered.length;i++) if(t>=V.buffered.start(i)-0.25 && t<=V.buffered.end(i)+0.05) return V.buffered.end(i);
  return t;   // 只把播放点所在的连续缓冲算作可用；后面隔着缺口的缓存不能用于当前播放
}
V.addEventListener('progress',updateSeekBar);
V.addEventListener('timeupdate',()=>{ if(!V.paused && V.currentTime>lastPlayedTime+0.05 && !recovering && !pendingResumeAt){ clearWaitTimer(); $('load').classList.remove('show'); } lastPlayedTime=V.currentTime;
  if(!dragging&&curFilm&&!isLiveNow){ const pos=vodBase+V.currentTime; if(recoverTimes && pos>recoverPos+10){ recoverTimes=0; }  // 播放真往前推进了 => 上次中断已恢复,重置恢复计数(原地循环重取因为没进展不会被清,最终触发上限停下)
  $('seek').value=pos; $('curT').textContent=fmt(pos); updateSeekBar();
  const now=Date.now(); if(now-lastSave>3000){ lastSave=now; saveState(); } } });   // 节流:播放中每3秒真正存一次进度(原来是防抖,播放中永不触发)
$('seek').addEventListener('input',()=>{ dragging=true; $('curT').textContent=fmt($('seek').value); updateSeekBar(); flashUI(); });
$('seek').addEventListener('change',()=>{ dragging=false; commitSeek(parseFloat($('seek').value)); });
$('seek').addEventListener('mousemove',e=>{ if(isLiveNow||!vodDur){ $('seekTip').style.display='none'; return; }
  const r=$('seek').getBoundingClientRect(); const frac=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));
  const t=$('seekTip'); t.textContent=fmt(frac*vodDur); t.style.left=e.clientX+'px'; t.style.top=(r.top-9)+'px'; t.style.display='block'; });
$('seek').addEventListener('mouseleave',()=>{ $('seekTip').style.display='none'; });
function bufferedVideoTime(absSec){ const t=absSec-vodBase;
  for(let i=0;i<V.buffered.length;i++) if(t>=V.buffered.start(i)+0.05 && t<=V.buffered.end(i)-0.05) return t;
  return null; }
function commitSeek(absSec){ if(!curFilm||!vodDur)return; absSec=Math.max(0,Math.min(vodDur-1,absSec));
  const local=bufferedVideoTime(absSec);
  if(local!=null){ V.currentTime=local; saveState(); return; }  // 真正缓冲内:精确无缝
  // 缓冲外:整数百分点重取。前进时保证新起点严格晚于当前位置,绝不后退(整数粒度下宁可多进一点也不倒退)
  const curAbs=vodBase+V.currentTime; let pct=Math.round(absSec/vodDur*100);
  if(absSec>curAbs){ while(pct/100*vodDur<=curAbs+1 && pct<96) pct++; }
  playEpisode(Math.max(0,Math.min(96,pct))); saveState(); }
let seekTarget=null, seekTimer=null;
function seekBy(delta){ if(isLiveNow||!curFilm||!vodDur)return; flashUI();
  const base=(seekTarget!=null)?seekTarget:(vodBase+V.currentTime);
  seekTarget=Math.max(0,Math.min(vodDur-1,base+delta));
  dragging=true; $('seek').value=seekTarget; $('curT').textContent=fmt(seekTarget); updateSeekBar();  // 立即视觉反馈,先不取流
  if(bufferedVideoTime(seekTarget)!=null){ const t=seekTarget; seekTarget=null; dragging=false; clearTimeout(seekTimer); commitSeek(t); return; }
  clearTimeout(seekTimer); seekTimer=setTimeout(()=>{ const t=seekTarget; seekTarget=null; dragging=false; commitSeek(t); },800); }   // 800ms:连按方向键合并成停手后的一次重取。每次重取都是一路全新P2P取流,高频start/stop会毒死原生引擎,所以宁可晚一点也不要churn
// —— 键盘 ——
document.addEventListener('keydown',e=>{
  const t=document.activeElement; if(t&&(t.tagName==='INPUT'||t.tagName==='SELECT'||t.tagName==='TEXTAREA'))return;
  if(e.code==='Escape'){
    if($('detail').classList.contains('show')){ closeDetail(); e.preventDefault(); return; }   // ESC 关选集,等同点✕
    if($('moreMenu').classList.contains('show')){ $('moreMenu').classList.remove('show'); e.preventDefault(); return; }
  }
  if(!player)return;
  if(e.code==='Space'){ e.preventDefault(); togglePP(); flashUI(); }
  else if(e.code==='ArrowLeft'){ e.preventDefault(); seekBy(-15); }
  else if(e.code==='ArrowRight'){ e.preventDefault(); seekBy(15); }
  else if(e.code==='ArrowUp'){ e.preventDefault(); setVol(0.05); }
  else if(e.code==='ArrowDown'){ e.preventDefault(); setVol(-0.05); }
  else if(e.code==='KeyF'){ toggleFS(); }
});

// —— 恢复策略(对齐原生App):临时卡顿不重取,让它自己缓冲恢复;
//    真结束(tell=2)自动下一集;真断流(ffmpeg退出)才从当前位置重取。 ——
let recovering=false, recoverTimes=0, lastRecover=0, recoverTimer=null, recoverPos=-1, fromRecovery=false, streamStartedAt=0;   // fromRecovery:本次换流是恢复流程自己发起的(而非用户操作)
function cancelRecovery(){ if(recoverTimer){clearTimeout(recoverTimer);recoverTimer=null;} recovering=false; }
// 用户主动换流(seek/切集/换台)时清零故障计数:这些不是"播放故障",不该累加到上限去弹"播放中断"。
// (只在非恢复流程中清零,否则恢复失败的循环会永远清零、失去上限保护)
// 用户自己点/拖/切集:清空故障计数,并取消未完成的恢复等待和恢复目标——一切以用户最新意图为准。
// 判据必须是"这次换流是不是恢复流程发起的"(fromRecovery),不能用 recovering:
// 否则用户在恢复退避期间拖进度会被旧的"最远位置"顶掉(比如先拖到远处又拖回近处,会被强行拉回远处)
function userAction(){ if(fromRecovery) return; recoverTimes=0; lastRecover=0; pendingResumeAt=0; pendingStartPaused=false;
  if(recoverTimer){ clearTimeout(recoverTimer); recoverTimer=null; } recovering=false; }
function playedToEnd(){ return !!vodDur && vodBase+V.currentTime>=vodDur-1.5; }
function streamConfirmedEnded(st,sid){
  // 标注片长可能短几十秒；必须播到服务端实际送达的片尾，才能切下一集。
  return !!st && st.endedSid===sid && st.endedAt>0 && vodBase+V.currentTime>=st.endedAt-1.5;
}
function atBufferedEnd(){ for(let i=0;i<V.buffered.length;i++) if(V.buffered.end(i)>V.currentTime+0.15) return false; return true; }
function resumeMargin(target){ return vodDur ? Math.min(RESUME_MARGIN,Math.max(0.5,vodDur-target-0.5)) : RESUME_MARGIN; }
function atEnd(){ if(!curFilm) return;   // 内容真结束:有下一集就自动切,否则显示播放结束
  if(curEpIdx<curEps.length-1){ curEpIdx++; playEpisode(resumePctFor(curFilm.playid,curEpIdx)); }
  else { $('loadtx').textContent='播放结束'; $('load').classList.add('show'); STAGE.classList.add('ui'); if(player){try{player.destroy()}catch(e){}player=null;} } }
function doRecover(){   // 断流/解码错误:先从当前位置重取续播;只有确认真到片尾才跳下一集(不再一到90%就跳)
  if(recovering||!player) return;
  const now=Date.now(); recoverTimes=(now-lastRecover<30000)?recoverTimes+1:1; lastRecover=now;
  recoverPos = isLiveNow?0:Math.max(pendingResumeAt||0, vodBase+V.currentTime);
  if(recoverTimes>14){   // 退避重试约2分钟仍不行才放弃(服务端遇到坏引擎会冷重启自愈,约需40-60秒,必须等得起)
    $('loadtx').textContent='播放中断，请重选节目'; $('load').classList.add('show'); STAGE.classList.add('ui'); if(player){try{player.destroy()}catch(e){}player=null;} return; }
  recovering=true; $('load').classList.add('show');
  $('loadtx').textContent = recoverTimes<=3 ? '恢复中…' : '引擎恢复中，请稍候…';
  // 关键:恢复等待期间视频停在流开头,若此时又断一次,不能用当前位置当目标(会倒退丢掉原中断点),
  // 必须保留最远的已看位置,否则反复恢复会一次次往回退
  const pos = isLiveNow ? 0 : Math.max(pendingResumeAt||0, vodBase + V.currentTime);
  recoverTimer=setTimeout(()=>{ recoverTimer=null; fromRecovery=true; try{
    if(isLiveNow){ startPlay(window.playTitle||$('ptitle').textContent, window.curUrl, true); }
    else if(curFilm){ const pct=vodDur?Math.max(curPct,Math.min(96,Math.floor(pos/vodDur*100))):0;
      const newBase=vodDur?Math.floor(pct/100*vodDur):0;
      pendingResumeAt = (pos-newBase>3) ? pos : 0; pendingMargin = resumeMargin(pos);   // 重取只能落到最近的1%(可能比中断处早几十秒):设定恢复目标,先静默缓冲越过它+攒余量再播,绝不让用户回头重看
      playEpisode(pct); }
  }catch(e){} fromRecovery=false; recovering=false; }, (Date.now()-streamStartedAt<25000 ? 4000 : (recoverTimes<=2?600:0)) || Math.min(10000,600*Math.pow(2,recoverTimes-2)));
  // 刚起播没多久就断=源在这个位置还没下载够(提前EOF),立刻重试只会再撞一次;等4秒让P2P追上来。其余情况按指数退避   // 指数退避:别在引擎自愈期间高频重试制造新churn
}
function fallbackToTranscode(){ const ep=curEps[curEpIdx]; if(!player||!ep||transcodeFallback.has(ep.channelId))return false;
  const pos=vodBase+V.currentTime, pct=vodDur?Math.min(96,Math.max(curPct,Math.floor(pos/vodDur*100))):curPct;
  const newBase=vodDur?Math.floor(pct/100*vodDur):0;
  transcodeFallback.add(ep.channelId); console.warn('媒体解码失败，改用转码',ep.channelId);
  fromRecovery=true; try{ pendingResumeAt=pos-newBase>3?pos:0; pendingMargin=resumeMargin(pos); playEpisode(pct); }finally{ fromRecovery=false; }
  return true; }
let failedMediaSid='', failedMediaChannel='', failedMediaAt=0, failedMediaCount=0;
function onMediaFailure(detail){
  if(failedMediaSid===activeStreamSid) return; failedMediaSid=activeStreamSid;
  const err=V.error, now=Date.now(), badDecode=(err&&err.code===3)||detail===mpegts.ErrorDetails.MEDIA_MSE_ERROR;
  console.warn('媒体故障', {detail,code:err&&err.code,message:err&&err.message,position:vodBase+V.currentTime,bufferedAhead:Math.max(0,bufferedEndAt(V.currentTime)-V.currentTime)});
  if(!isLiveNow && badDecode){
    if(failedMediaChannel!==curId || now-failedMediaAt>10*60*1000) failedMediaCount=0;
    failedMediaChannel=curId; failedMediaAt=now; failedMediaCount++;
    if(failedMediaCount>=2 && fallbackToTranscode()) return;
  }
  doRecover();
}
V.addEventListener('error', ()=>{ if(!isLiveNow && V.error && V.error.code===4 && fallbackToTranscode())return;
  if(!recovering && !switching) onMediaFailure('video error'); });   // 重复解码错误改走转码,并记录错误码以便区分源故障
V.addEventListener('ended', async ()=>{   // 浏览器播完可能只是原生进程断了；服务端确认片尾后才切集。
  if(isLiveNow||!curFilm||!vodDur||recovering||switching) return;
  const sid=activeStreamSid;
  try{ const st=await jget('api/streamstate');
    if(sid!==activeStreamSid||recovering||switching) return;
    if(playedToEnd() && streamConfirmedEnded(st,sid)) atEnd(); else doRecover();
  }catch(e){ if(sid===activeStreamSid) doRecover(); } });
// 卡顿看门狗:进度冻结且无数据(readyState<3)约12秒 -> 查 streamstate 决定怎么办
let wdLast=0, wdStall=0, checking=false;
setInterval(async ()=>{
  if(!player||recovering){ wdStall=0; wdLast=V.currentTime; return; }
  if(pendingResumeAt){ wdStall=0; wdLast=V.currentTime; return; }   // 恢复等待中(故意暂停攒缓冲),由等待器负责
  if(V.paused){ wdStall=0; wdLast=V.currentTime; return; }   // 用户暂停时绝不自动跳集
  const frozen = Math.abs(V.currentTime-wdLast)<0.1; wdLast=V.currentTime;
  if(frozen && V.readyState<3){ wdStall++; } else { wdStall=0; }
  if(wdStall>=4 && !checking){ checking=true;
    try{ const st=await jget('api/streamstate');
      if(streamConfirmedEnded(st,activeStreamSid) && playedToEnd() && atBufferedEnd()){ wdStall=0; atEnd(); }
      else if(!st.alive){ wdStall=0; doRecover(); }   // 源断流不等于本集播完，片尾仍要先重取
      else if(wdStall>=8){ wdStall=0; doRecover(); }   // alive但播放中持续冻结~24s=源真卡住(点播已去掉ffmpeg读超时,改由此处检测)->从当前位置重取
      // else(alive且冻结<24s):临时卡顿,先等缓冲自愈,wdStall继续累加到8再重取
    }catch(e){} checking=false;
  }
}, 3000);
V.addEventListener('waiting', ()=>{ if(!player||recovering||pendingResumeAt||V.paused) return;
  clearWaitTimer(); const sid=activeStreamSid, at=V.currentTime;
  waitTimer=setTimeout(()=>{ waitTimer=null; if(!player||sid!==activeStreamSid||recovering||pendingResumeAt||V.paused||V.currentTime>at+0.2)return;
    $('loadtx').textContent='缓冲中…'; $('load').classList.add('show'); },800);
});
let deferredCatsRefresh=false;
function refreshDeferredCats(){ if(deferredCatsRefresh){ deferredCatsRefresh=false; setTimeout(()=>loadCats(),5000); } }
V.addEventListener('playing', ()=>{ clearWaitTimer(); if(!recovering&&!pendingResumeAt) $('load').classList.remove('show'); wdStall=0; if(isLiveNow)livePauseStartedAt=0;
  if(!isLiveNow) refreshDeferredCats();
});   // 真正播放后再更新侧栏分类，避免冷启动取流时元数据请求争用原生引擎

// —— 人声增强(Web Audio 动态范围压缩) ——
let audioCtx=null, srcNode=null, compNode=null, gainNode=null, masterGain=null, audioReady=false;
let dialogMode = LS.get('txtv_dialog', true); // 默认开启,只做选择性关闭
function setupAudio(){ if(audioCtx)return true;
  try{ audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    srcNode=audioCtx.createMediaElementSource(V); compNode=audioCtx.createDynamicsCompressor(); gainNode=audioCtx.createGain();
    masterGain=audioCtx.createGain(); masterGain.gain.value=volumeSettable?1:curVol; masterGain.connect(audioCtx.destination);
    routeAudio(); return true; }catch(e){ console.warn('audio setup fail',e); return false; } }
function routeAudio(){ if(!audioCtx)return;
  try{ srcNode.disconnect(); compNode.disconnect(); gainNode.disconnect(); }catch(e){}
  if(dialogMode){ compNode.threshold.value=-45; compNode.knee.value=30; compNode.ratio.value=12; compNode.attack.value=0.003; compNode.release.value=0.25; gainNode.gain.value=1.7;
    srcNode.connect(compNode); compNode.connect(gainNode); gainNode.connect(masterGain); }
  else { srcNode.connect(masterGain); } }
// 首次用户交互时初始化音频(浏览器策略要求手势),默认按 dialogMode 生效
function initAudioOnce(){ if(audioReady)return; audioReady=true; setupAudio(); if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume(); }
document.addEventListener('click', initAudioOnce, {once:true, capture:true});
document.addEventListener('touchend', initAudioOnce, {once:true, capture:true, passive:true});
document.addEventListener('touchend', ()=>{ if(audioCtx&&audioCtx.state!=='running'){ try{ audioCtx.resume().catch(()=>{}); }catch(e){} } }, {capture:true, passive:true});   // iOS 切后台会把 AudioContext 挂起,回来一碰就恢复
document.addEventListener('keydown', initAudioOnce, {once:true, capture:true});
function toggleDialog(){ if(!setupAudio())return; if(audioCtx.state==='suspended')audioCtx.resume(); dialogMode=!dialogMode; routeAudio(); LS.set('txtv_dialog',dialogMode); $('mDialog').classList.toggle('on',dialogMode); }
$('moreBtn').onclick=(e)=>{ e.stopPropagation(); $('mDialog').classList.toggle('on',dialogMode); $('moreMenu').classList.toggle('show'); };
$('moreMenu').addEventListener('click',e=>e.stopPropagation());
document.addEventListener('click',()=>$('moreMenu').classList.remove('show'));

let heartbeatTimer=null;
function startHeartbeat(){ if(heartbeatTimer)return; heartbeatTimer=setInterval(()=>{ if(!document.hidden) fetch('api/heartbeat',{method:'POST'}).catch(()=>{}); },20000); }   // 只要页面开着就保活
// 点播播放时每2秒上报缓冲深度,供服务端反馈节流控制深缓冲上限
// —— 恢复不回头看 ——
// 断流重取只能落到最近的整数百分点(可能比中断处早几十秒)。做法:重取后先不播,静默缓冲,
// 等缓冲越过中断位置、并且再往后攒够 RESUME_MARGIN 秒余量,才跳回中断处继续播。
// 余量是关键:缓冲一到就播往往刚播就见底->又断->又回到那个百分点->死循环。
let pendingResumeAt=0, pendingMargin=12, resumeLastBuf=0, resumeLastGrow=0, resumeLastCheck=0, resumeChecking=false;
const RESUME_MARGIN=10, START_PREBUFFER=6;   // 起播预缓冲 6 秒:起播就播(canplay 时只有 1-2 秒)必然放几秒就见底->卡顿->触发恢复(表现为"回退");也别设太大,拖长每次起播/跳转的等待。(旧注释说"源每个连接只送约12MB就关"是服务端晚到 stop 造成的假象,源本身不会主动关连接,见 server.js queueStop)
setInterval(()=>{
  if(!pendingResumeAt || !player || isLiveNow || !curFilm || recovering) return;
  const bufEndAbs = V.buffered.length ? vodBase+V.buffered.end(V.buffered.length-1) : vodBase;
  const now=Date.now();
  if(bufEndAbs>resumeLastBuf+0.2){ resumeLastBuf=bufEndAbs; resumeLastGrow=now; }        // 数据在流动
  const targetTime=pendingResumeAt-vodBase, readyEnd=bufferedEndAt(targetTime);
  // 缓冲刚越过中断位置就先跳过去(此时已看过的部分变成"背后",会被自动回收,避免缓冲无限膨胀)
  if(readyEnd>targetTime && (vodBase+V.currentTime) < pendingResumeAt-0.5){
    try{ V.currentTime = targetTime; }catch(e){}
  }
  const ahead = Math.max(0,readyEnd-targetTime);
  // 跳转后P2P常常"先给一小段、再安静十几秒去找数据、然后才稳定供流"。
  // 余量小时仍要求源正在供数；余量已有30秒时即使服务端因缓冲已满而节流，也可安全开播。
  const flowing = resumeLastGrow && (now-resumeLastGrow < 2000);
  if(ahead >= pendingMargin && (flowing || ahead>=30 || (vodDur && vodDur-pendingResumeAt<=RESUME_MARGIN+2))){
    const keepPaused=pendingStartPaused; pendingStartPaused=false; pendingResumeAt=0; $('load').classList.remove('show'); V.playbackRate=curSpeed;
    if(keepPaused){ V.pause(); saveState(); refreshDeferredCats(); } else V.play().catch(()=>{}); return;
  }
  if(resumeLastGrow && now-resumeLastGrow>12000){
    if(!resumeChecking && now-resumeLastCheck>5000){
      resumeChecking=true; resumeLastCheck=now; const sid=activeStreamSid;
      jget('api/streamstate').then(st=>{
        if(sid!==activeStreamSid || !pendingResumeAt || recovering) return;
        if(st.alive && Date.now()-resumeLastGrow<120000){
          $('loadtx').textContent=st.starting?'淘星源尚未送来视频，正在取流…':st.splicing?'淘星源中断，正在续接…':st.feeding?'已收到视频，正在等待解码…':'淘星源暂时无数据，正在等待续接…';
          return;
        }
        doRecover();   // 服务端已明确失败，或持续两分钟没有新增可播数据
      }).catch(()=>{ if(sid===activeStreamSid && pendingResumeAt && Date.now()-resumeLastGrow>120000) doRecover(); })
        .finally(()=>{ resumeChecking=false; });
    }
    return;
  }
  // 这里是与上次观看位置相差的节目时长，不是预计等待的实际秒数。
  const missing=Math.ceil(pendingResumeAt-bufEndAbs);
  $('loadtx').textContent = missing>0
    ? (V.buffered.length===0 && now-resumeLastGrow>15000 ? '片源暂未供数 · 距上次进度约'+missing+'秒内容' : '恢复进度 · 还差约'+missing+'秒节目内容')
    : ('缓冲中… '+Math.floor(ahead)+'/'+pendingMargin+' 秒'+(flowing?'':'(源正在准备)'));
}, 500);

let drainChecking=false, dryStart=0;   // dryStart:缓冲见底且源不出数据的起始时刻。短暂不出数据是P2P常态,必须等,不能立刻重取(重取=churn=把引擎搞坏)
setInterval(async ()=>{ if(player && !isLiveNow && curFilm){   // 暂停时也要上报缓冲量和暂停状态，供服务端填库并探测断源
  const bufEndAbs = V.buffered.length ? vodBase+V.buffered.end(V.buffered.length-1) : vodBase;
  // 恢复等待期间按"目标位置之后还有多少"上报(否则服务端会以为缓冲已满而停止供数,永远等不到目标)
  const a = pendingResumeAt ? Math.max(0,bufferedEndAt(pendingResumeAt-vodBase)-(pendingResumeAt-vodBase))
                            : Math.max(0,bufferedEndAt(V.currentTime)-V.currentTime);
  const reportPos = Math.max(pendingResumeAt||0, vodBase+V.currentTime);
  fetch('api/buf?sid='+activeStreamSid+'&d='+a.toFixed(1)+'&p='+(V.paused&&!pendingResumeAt?'1':'0')+'&pos='+reportPos.toFixed(1)).catch(()=>{});   // 预缓冲中的暂停不算用户主动暂停；位置用来限制已送出但尚未追加到 MSE 的数据
  // 恢复无缝的关键——纯缓冲驱动决定重连时机:缓冲快见底(<6s)才查源在不在供数;源真断了就从当前位置重连。暂停时服务端持续填库和探测。
  if(a >= 6) dryStart=0;   // 缓冲回来了,清空"干涸"计时
  if(a < 6 && !V.paused && !pendingResumeAt && !recovering && !switching && !drainChecking){ drainChecking=true;   // 暂停时不做见底判断(不消耗缓冲,也不该重取)
    try{ const st=await jget('api/streamstate');
      if(!st.alive){ dryStart=0;
        if(playedToEnd() && streamConfirmedEnded(st,activeStreamSid) && atBufferedEnd()) atEnd();
        else if(!(vodDur && vodDur-(vodBase+V.currentTime)<8 && a>0.3)) doRecover();   // 末尾仍有可播数据时先播完，避免重取吞掉最后几秒
      }
      else if(!st.feeding){                                           // 源暂时没出数据:这在P2P很常见,原生就是转圈等
        if(!dryStart) dryStart=Date.now();
        else if(Date.now()-dryStart > 45000){ dryStart=0; doRecover(); }   // 持续45秒才重取:重取会让P2P从头爬坡,通常比继续等更糟
        if(dryStart) $('loadtx').textContent='缓冲中…';
      } else dryStart=0;                                              // 还在供数,只是慢,继续等
    }catch(e){}
    drainChecking=false;
  }
} }, 2000);  // 有播放器(观看会话中,含暂停)就保活;暂停/浏览空闲则由空闲定时器回收
window.addEventListener('pagehide',()=>{ saveState(); if(activeStreamSid) navigator.sendBeacon('api/leave?sid='+encodeURIComponent(activeStreamSid)); });
boot();
</script>
</body></html>

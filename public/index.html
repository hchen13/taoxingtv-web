<!doctype html><html lang="zh"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>淘星TV</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📺</text></svg>">
<style>
  :root{--bg:#0d0f14;--panel:#151922;--panel2:#1b2130;--line:#232a3a;--txt:#e6e9ef;--dim:#8a93a6;--acc:#3b82f6;--acc2:#2563eb}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font:14px/1.5 -apple-system,"PingFang SC",system-ui,sans-serif;height:100vh;overflow:hidden}
  .app{display:grid;grid-template-columns:340px 1fr;height:100vh;transition:grid-template-columns .22s ease}
  .app.collapsed{grid-template-columns:0 1fr}
  .side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;overflow:hidden}
  .tabs{display:flex;border-bottom:1px solid var(--line)}
  .tabs button{flex:1;padding:15px 0;background:none;border:none;color:var(--dim);font-size:15px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent}
  .tabs button.on{color:var(--txt);border-bottom-color:var(--acc)}
  .search{padding:12px}
  .search input{width:100%;padding:10px 12px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--txt);outline:none}
  .search input:focus{border-color:var(--acc)}
  .cats{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px 4px}
  .cats button{padding:5px 12px;background:var(--panel2);border:1px solid var(--line);border-radius:16px;color:var(--dim);font-size:13px;cursor:pointer}
  .cats button.on{background:var(--acc2);color:#fff;border-color:var(--acc2)}
  .list{flex:1;overflow-y:auto;padding:0 8px 12px}
  #liveBox,#vodBox{flex:1;display:flex;flex-direction:column;min-height:0}
  .row{display:flex;align-items:center;gap:10px;padding:8px 11px;border-radius:8px;cursor:pointer}
  .row:hover{background:var(--panel2)}
  .row.on{background:var(--acc2)}
  .row .idx{width:30px;color:var(--dim);font-variant-numeric:tabular-nums;font-size:12px;flex:none;text-align:center}
  .row .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .rk{color:var(--dim);font-size:12px;flex:none;max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row.on .rk,.row.on .idx{color:#cfe0ff}
  .thumb{width:38px;height:52px;flex:none;border-radius:4px;object-fit:cover;background:var(--panel2)}
  .logo{width:44px;height:34px;flex:none;object-fit:contain;background:#0a0c10;border-radius:4px}
  .thumb.noimg,.logo.noimg{visibility:hidden}
  .muted{padding:20px;color:var(--dim)}
  .main{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;background:#000;position:relative}
  .sideToggle{position:absolute;left:0;top:50%;transform:translateY(-50%);z-index:5;width:20px;height:64px;background:rgba(0,0,0,.45);color:#fff;border:none;border-radius:0 9px 9px 0;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;opacity:.28;transition:opacity .2s,background .2s}
  .sideToggle:hover{opacity:.95;background:rgba(0,0,0,.72)}
  .stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;background:#000;overflow:hidden}
  video{width:100%;height:100%;background:#000;object-fit:contain}
  .hint{position:absolute;color:var(--dim);font-size:15px;text-align:center;pointer-events:none}
  .load{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:rgba(0,0,0,.55);pointer-events:none;z-index:3}
  .load.show{display:flex}
  .spin{width:44px;height:44px;border:3px solid #2a3346;border-top-color:var(--acc);border-radius:50%;animation:s 1s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  .ptitle{position:absolute;top:0;left:0;right:0;padding:16px 20px;font-size:16px;font-weight:600;color:#fff;background:linear-gradient(180deg,rgba(0,0,0,.6),transparent);opacity:0;transition:opacity .2s;pointer-events:none;z-index:4}
  .stage.ui .ptitle{opacity:1}
  .pctl{position:absolute;left:0;right:0;bottom:0;padding:26px 18px 14px;background:linear-gradient(0deg,rgba(0,0,0,.72),transparent);display:flex;align-items:center;gap:12px;opacity:0;transition:opacity .2s;z-index:4}
  .stage.ui .pctl{opacity:1}
  .stage:fullscreen:not(.ui) video{cursor:none}          /* 全屏且鼠标静止(控制栏已隐藏)时隐藏光标,不挡画面;一动就随控制栏一起回来 */
  .stage:-webkit-full-screen:not(.ui) video{cursor:none}
  .pbtn{height:40px;min-width:40px;padding:0 8px;border:none;background:transparent;color:#fff;font-size:19px;cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:8px;white-space:nowrap}
  .pbtn:hover{background:rgba(255,255,255,.15)}
  .pbtn.txt{font-size:14px}
  .pbtn.on{color:var(--acc);background:rgba(59,130,246,.18)}
  .moreWrap{position:relative;flex:none}
  .moreMenu{position:absolute;right:0;bottom:50px;background:#1b2130;border:1px solid var(--line);border-radius:10px;padding:6px;min-width:158px;display:none;box-shadow:0 8px 28px rgba(0,0,0,.55)}
  .moreMenu.show{display:block}
  .mitem{display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:7px;cursor:pointer;color:var(--txt);font-size:14px;white-space:nowrap}
  .mitem:hover{background:var(--panel2)}
  .mitem .chk{width:15px;color:var(--acc);visibility:hidden;font-weight:700}
  .mitem.on .chk{visibility:visible}
  .pbtn:disabled{color:#5a6273;cursor:default}
  .pbtn:disabled:hover{background:transparent}
  .tm{color:#e8ebf2;font-size:14px;font-variant-numeric:tabular-nums;flex:none;min-width:56px;text-align:center}
  .seek{flex:1;min-width:80px;-webkit-appearance:none;height:6px;border-radius:3px;background:rgba(255,255,255,.28);outline:none;cursor:pointer}
  #seekTip{position:fixed;transform:translate(-50%,-100%);background:rgba(0,0,0,.88);color:#fff;font-size:14px;padding:4px 9px;border-radius:7px;pointer-events:none;z-index:12;display:none;font-variant-numeric:tabular-nums;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.5)}
  .seek::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:#fff;cursor:pointer;box-shadow:0 0 0 3px rgba(59,130,246,.45)}
  .volsl{width:88px;-webkit-appearance:none;height:5px;border-radius:3px;background:rgba(255,255,255,.28);outline:none;cursor:pointer}
  .volsl::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:#fff;cursor:pointer}
  .liveInd{color:#ff5a5a;font-size:14px;font-weight:600;flex:none}
  #speed{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:8px;padding:7px 10px;font-size:14px;cursor:pointer;flex:none}
  .vodOnly,.liveOnly{display:none}
  .stage.vod .vodOnly{display:flex}
  .stage.live .liveOnly{display:flex}
  select.vodOnly{display:none}.stage.vod select.vodOnly{display:inline-block}
  .volpop{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.7);color:#fff;padding:10px 18px;border-radius:10px;font-size:20px;font-weight:600;opacity:0;transition:opacity .25s;pointer-events:none;z-index:6}
  .volpop.show{opacity:1}
  .detail{position:absolute;inset:0;background:rgba(13,15,20,.97);z-index:8;display:none;padding:34px 44px;overflow-y:auto}
  .detail.show{display:block}
  .detail .head{display:flex;gap:34px;margin-bottom:28px}
  .detail .poster{width:270px;height:378px;flex:none;border-radius:12px;background:var(--panel2) center/cover no-repeat;box-shadow:0 4px 18px rgba(0,0,0,.4)}
  .detail h2{font-size:38px;margin-bottom:16px}
  .detail .meta{color:var(--dim);font-size:18px;margin-bottom:18px;line-height:2.0}
  .detail .desc{color:#c3cad8;font-size:18px;line-height:1.85;max-width:1000px}
  .detail .epstitle{color:var(--dim);font-size:18px;margin:14px 0 14px}
  .detail .eps{display:grid;gap:24px 12px}
  .detail .eps .epcell{position:relative}
  .detail .eps .epcell>button{width:100%}
  .detail .eps .epcell.last>button{border-color:var(--acc);background:#243049}
  .detail .eps .epcell.last::after{content:'上次看到';position:absolute;top:-11px;left:50%;transform:translateX(-50%);background:var(--acc);color:#fff;font-size:12px;font-weight:600;padding:2px 9px;border-radius:9px;white-space:nowrap;z-index:2;pointer-events:none;box-shadow:0 2px 6px rgba(0,0,0,.45)}
  .detail .eps button{padding:16px 16px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--txt);cursor:pointer;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .detail .eps button:hover{border-color:var(--acc);background:#243049}
  .detail .close{position:absolute;top:18px;right:22px;background:none;border:none;color:var(--dim);font-size:26px;cursor:pointer;z-index:9}
  #wake{position:fixed;inset:0;z-index:99;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px}
  #wake.hide{display:none}
  #wake .logo2{font-size:34px;font-weight:800}#wake .step{color:var(--dim);font-size:14px}
  #wake .prog{width:260px;height:4px;background:var(--panel2);border-radius:2px;overflow:hidden}
  #wake .prog i{display:block;height:100%;width:2%;background:var(--acc);border-radius:2px;transition:width .45s ease}
  #wakeProg{display:flex;flex-direction:column;align-items:center;gap:16px}
  #loginBox{display:flex;flex-direction:column;gap:12px;width:290px}
  #loginBox .lt{font-size:15px;color:var(--txt);text-align:center;margin-bottom:2px}
  #loginBox input{padding:12px 14px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--txt);font-size:15px}
  #loginBox input:focus{border-color:var(--acc);outline:none}
  #loginBox button{padding:12px;background:var(--acc);color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer}
  #loginBox button:disabled{opacity:.55;cursor:default}
  #liErr{color:#ff6b6b;font-size:13px;min-height:16px;text-align:center}
  @keyframes sl{0%{margin-left:-30%}100%{margin-left:100%}}
</style></head><body>
<div id="wake"><div class="logo2">📺 淘星TV</div>
  <div id="wakeProg"><div class="prog"><i></i></div><div class="step" id="wstep">正在唤醒…</div></div>
  <div id="loginBox" style="display:none">
    <div class="lt">登录淘星TV账号</div>
    <input id="liAccount" placeholder="账号" autocomplete="username">
    <input id="liPassword" type="password" placeholder="密码" autocomplete="current-password">
    <button id="liBtn" onclick="doLogin()">登录</button>
    <div id="liErr"></div>
  </div>
</div>
<div class="app">
  <aside class="side">
    <div class="tabs"><button id="tabLive" class="on" onclick="switchTab('live')">直播</button><button id="tabVod" onclick="switchTab('vod')">点播</button></div>
    <div id="liveBox"><div class="search"><input id="q" placeholder="搜索频道…"></div><div class="list" id="listLive"></div></div>
    <div id="vodBox" style="display:none"><div class="search"><input id="vq" placeholder="搜索片名(中文)… 如 黄石"></div><div class="cats" id="cats"></div><div class="list" id="listVod"></div></div>
  </aside>
  <section class="main">
    <button class="sideToggle" id="sideTgl" onclick="toggleSide()" title="收起/展开节目栏">‹</button>
    <div class="stage" id="stage">
      <video id="v" playsinline></video>
      <div class="hint" id="hint">← 从左侧选一个频道开始观看</div>
      <div class="ptitle" id="ptitle"></div>
      <div class="volpop" id="volpop"></div>
      <div class="load" id="load"><div class="spin"></div><div id="loadtx">正在连接…</div></div>
      <div class="pctl" id="pctl">
        <button class="pbtn" id="ppBtn" title="播放/暂停(空格)">▶</button>
        <button class="pbtn txt vodOnly" id="prevBtn" title="上一集">⏮</button>
        <button class="pbtn txt vodOnly" id="nextBtn" title="下一集">⏭</button>
        <span class="tm vodOnly" id="curT">0:00</span>
        <input type="range" class="seek vodOnly" id="seek" min="0" max="1000" value="0"><div id="seekTip"></div>
        <span class="tm vodOnly" id="totT">0:00</span>
        <span class="liveInd liveOnly" id="liveInd">● 直播中</span>
        <span style="flex:1" class="liveOnly"></span>
        <button class="pbtn" id="volBtn" title="静音">🔊</button>
        <input type="range" class="volsl" id="vol" min="0" max="1" step="0.05" value="1">
        <select id="speed" class="vodOnly"><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option></select>
        <button class="pbtn txt vodOnly" id="epsBtn" title="选集" onclick="reopenEps()">选集</button>
        <div class="moreWrap"><button class="pbtn" id="moreBtn" title="更多">⋯</button>
          <div class="moreMenu" id="moreMenu">
            <div class="mitem on" id="mDialog" onclick="toggleDialog()"><span class="chk">✓</span><span>人声增强</span></div>
          </div>
        </div>
        <button class="pbtn" id="fsBtn" title="全屏(双击画面)">⛶</button>
      </div>
      <div class="detail" id="detail"><button class="close" onclick="closeDetail()">✕</button>
        <div class="head"><div class="poster" id="dPoster"></div><div style="flex:1">
          <h2 id="dTitle"></h2><div class="meta" id="dMeta"></div><div class="desc" id="dDesc"></div></div></div>
        <div class="epstitle">选集播放</div><div class="eps" id="dEps"></div>
      </div>
    </div>
  </section>
</div>
<script src="/mpegts.js"></script>
<script>
let channels=[], cats=[], films=[], player=null, curId=null, mode='live', reqSeq=0, curCat=null, filmsCache={};
let curFilm=null, curEps=[], curEpIdx=0, vodBase=0, vodDur=0, dragging=false, curSpeed=1, isLiveNow=false, curPct=0, switching=false;
const $=id=>document.getElementById(id);
// —— 唤醒进度条(按启动步骤+耗时填充,不显示数字) ——
let wakeStart=Date.now(), wakeStep='', wakeIv=null;
function setWakeProg(p){ const el=document.querySelector('#wake .prog i'); if(el) el.style.width=Math.max(2,Math.min(100,p))+'%'; }
function bootPct(){ const map=[['启动模拟器',8],['系统就绪',35],['取流引擎',50],['冷重启',55],['P2P',68],['注入',86],['就绪',90]]; let p=5; if(wakeStep)for(const kv of map){ if(wakeStep.indexOf(kv[0])>=0){ p=kv[1]; break; } } return Math.max(p, Math.min(88,(Date.now()-wakeStart)/46000*100)); }  // 步骤里程碑 与 按~46s匀速爬 取大者,总在动
function startWakeProg(){ wakeStart=Date.now(); wakeStep=''; if(wakeIv)clearInterval(wakeIv); wakeIv=setInterval(()=>setWakeProg(bootPct()),300); }
function stopWakeProg(){ if(wakeIv){clearInterval(wakeIv);wakeIv=null;} }
const jget=async(u,o)=>{ const r=await fetch(u,o); if(!r.ok){ let m=''; try{m=(await r.json()).error||'';}catch(e){} throw new Error('HTTP '+r.status+(m?': '+m:'')); } return r.json(); };
const V=$('v'), STAGE=$('stage');
const fmt=s=>{s=Math.max(0,Math.floor(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=s%60;return (h?h+':':'')+(h?String(m).padStart(2,'0'):m)+':'+String(ss).padStart(2,'0');};
const LS={get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

async function boot(){ startWakeProg(); try{
  let st=await jget('/api/status');
  if(st.state!=='ready'){ await fetch('/api/wake',{method:'POST'});
    let ok=false;
    for(let i=0;i<90;i++){ await new Promise(r=>setTimeout(r,1200)); try{st=await jget('/api/status');}catch(e){continue;}
      wakeStep=st.step||''; $('wstep').textContent=st.step||'正在唤醒引擎…';
      if(st.state==='ready'){ok=true;break;} if(st.step&&st.step.startsWith('启动失败')){stopWakeProg(); $('wstep').textContent=st.step;return;} }
    if(!ok){ stopWakeProg(); $('wstep').textContent='唤醒超时，请刷新重试'; return; } }
  stopWakeProg(); setWakeProg(92); $('wstep').textContent='检查登录…';
  let ls; try{ ls=await jget('/api/loginstate'); }catch(e){ ls={loggedIn:false,hasSavedCreds:false}; }
  if(!ls.loggedIn){
    if(ls.hasSavedCreds){ $('wstep').textContent='自动登录中…'; setWakeProg(95); const r=await loginRequest({useSaved:true}); if(!r.ok){ showLogin(r.error||'自动登录失败，请重新登录'); return; } }
    else { showLogin(''); return; }
  }
  await afterLogin();
  }catch(e){ $('wstep').textContent='连接失败: '+(e.message||e)+'（请刷新）'; }
}
async function afterLogin(){
  const d=await jget('/api/channels');
  if(d.error){$('wstep').textContent='引擎未就位: '+d.error;return;}
  channels=d.live||[]; window.expiredTime=d.expiredTime||'';
  stopWakeProg(); setWakeProg(100); $('wake').classList.add('hide'); startHeartbeat(); restore();
}
function showLogin(err){ $('wakeProg').style.display='none'; $('loginBox').style.display='flex'; $('liErr').textContent=err||''; $('liBtn').disabled=false; $('liBtn').textContent='登录'; }
async function loginRequest(body){
  try{ const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); return await r.json(); }
  catch(e){ return {ok:false,error:'网络错误'}; }
}
async function doLogin(){
  const account=$('liAccount').value.trim(), password=$('liPassword').value.trim();
  if(!account||!password){ $('liErr').textContent='请输入账号和密码'; return; }
  $('liBtn').disabled=true; $('liBtn').textContent='登录中…（约10-20秒）'; $('liErr').textContent='';
  const r=await loginRequest({account,password});
  if(r.ok){ $('loginBox').style.display='none'; $('wakeProg').style.display=''; $('wstep').textContent='登录成功，加载中…'; await afterLogin(); }
  else { $('liErr').textContent=r.error||'登录失败'; $('liBtn').disabled=false; $('liBtn').textContent='登录'; }
}
['liAccount','liPassword'].forEach(id=>{ const el=$(id); if(el) el.addEventListener('keydown',e=>{ if(e.key==='Enter') doLogin(); }); });
// —— 状态持久化 ——
// —— 观看进度:每个节目(playid)只存一条 {ep:最后看的那一集, pct:该集的时刻%}。换集=刷新覆盖,不为每集单独存 ——
function getProg(){ return LS.get('txtv_prog',{}); }
function saveProg(playid, ep, pct){ if(playid==null) return; const all=getProg(); all[playid]={ep:ep, pct:(pct>=0?pct:0)}; LS.set('txtv_prog',all); }
function resumePctFor(playid, ep){ const p=getProg()[playid]; if(!p||p.ep!==ep) return 0;   // 只有点的正是"最后看的那一集"才续播;别的集从头
  if(p.pct==null||p.pct<1||p.pct>=95) return 0; return Math.min(96,Math.floor(p.pct)); }       // 几乎没看/已看完 => 从头
function saveState(){ const s={tab:mode};
  if(curFilm){ const pct=vodDur?((vodBase+V.currentTime)/vodDur*100):0; s.vod={film:curFilm,eps:curEps,idx:curEpIdx,dur:vodDur,percent:pct};
    if(!isLiveNow && curFilm.playid!=null) saveProg(curFilm.playid, curEpIdx, pct); }
  else if(curId&&isLiveNow){ const c=channels.find(x=>x.channelId===curId); if(c)s.live={id:c.channelId,link:c.link,name:c.name,index:c.index}; }
  LS.set('txtv_state',s); }
async function restore(){ const s=LS.get('txtv_state',null);
  if(!s){ renderChannels(channels); return; }
  if(s.vod&&s.vod.film){ switchTab('vod'); curFilm=s.vod.film; curEps=s.vod.eps||[]; curEpIdx=s.vod.idx||0; vodDur=s.vod.dur||0;
    if(curEps[curEpIdx]){ const rp=resumePctFor(curFilm.playid,curEpIdx); playEpisode(rp||Math.max(0,Math.min(96,Math.floor(s.vod.percent||0)))); } }
  else if(s.live&&s.live.id){ switchTab('live'); playLive({channelId:s.live.id,link:s.live.link,name:s.live.name,index:s.live.index}); }
  else { switchTab(s.tab||'live'); }
}
// —— 最近播放 ——
function pushRecent(item){ let r=LS.get('txtv_recent',[]); r=r.filter(x=>x.key!==item.key); r.unshift(item); r=r.slice(0,24); LS.set('txtv_recent',r); }
function getRecent(){ return LS.get('txtv_recent',[]); }
function switchTab(m){ mode=m; closeDetail(); saveState();
  $('tabLive').classList.toggle('on',m==='live'); $('tabVod').classList.toggle('on',m==='vod');
  $('liveBox').style.display=m==='live'?'':'none'; $('vodBox').style.display=m==='vod'?'':'none';

function startPlay(title,url,isLive){ isLiveNow=isLive; window.curUrl=url; window.playTitle=title; cancelRecovery(); switching=true; setTimeout(()=>{switching=false;},3000); if(typeof wdStall!=='undefined'){wdStall=0;wdLast=0;}

  if(player){try{player.destroy()}catch(e){}player=null;}
  // 直播和点播都是"连续流"(点播靠 percent 重启来跳转),统一用 isLive:true 避免 VOD 模式的 range 请求/缓冲上限关连接
  player=mpegts.createPlayer({type:'mpegts',isLive:true,url:url},

     // 直播:关掉"追帧"(旧逻辑缓冲一超5秒就硬seek砍到1秒,把能吸收源抖动的余量丢掉);保留服务端catchup攒起来的深缓冲,

  const p=$('volpop'); p.textContent='🔊 '+Math.round(V.volume*100)+'%'; p.classList.add('show'); clearTimeout(p._t); p._t=setTimeout(()=>p.classList.remove('show'),700); }
let saveTimer=null, lastSave=0;
function updateSeekBar(){ if(isLiveNow||!curFilm)return; const dur=vodDur||1;
  const cur=dragging?parseFloat($('seek').value||0):(vodBase+V.currentTime);
  const played=Math.max(0,Math.min(100,cur/dur*100));
  let buf=played; if(V.buffered&&V.buffered.length){ buf=Math.max(played,Math.min(100,(vodBase+V.buffered.end(V.buffered.length-1))/dur*100)); }
  // 蓝=已播放 / 白=已缓冲未播 / 灰=未缓冲
  $('seek').style.background='linear-gradient(to right, var(--acc) 0 '+played+'%, rgba(255,255,255,.9) '+played+'% '+buf+'%, rgba(255,255,255,.28) '+buf+'% 100%)'; }
V.addEventListener('progress',updateSeekBar);
V.addEventListener('timeupdate',()=>{ if(!dragging&&curFilm&&!isLiveNow){ const pos=vodBase+V.currentTime; if(lastRecoverPos>=0 && pos>lastRecoverPos+10){ lastRecoverPos=-1; recoverTimes=0; }  // 播放真往前推进了 => 上次断流不是真结尾,清标记+重置恢复计数(循环重取因为没进展,计数不会被清,最终触发上限停下)
  $('seek').value=pos; $('curT').textContent=fmt(pos); updateSeekBar();
  const now=Date.now(); if(now-lastSave>3000){ lastSave=now; saveState(); } } });   // 节流:播放中每3秒真正存一次进度(原来是防抖,播放中永不触发)
$('seek').addEventListener('input',()=>{ dragging=true; $('curT').textContent=fmt($('seek').value); updateSeekBar(); });
$('seek').addEventListener('change',()=>{ dragging=false; commitSeek(parseFloat($('seek').value)); });
$('seek').addEventListener('mousemove',e=>{ if(isLiveNow||!vodDur){ $('seekTip').style.display='none'; return; }
  const r=$('seek').getBoundingClientRect(); const frac=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));
  const t=$('seekTip'); t.textContent=fmt(frac*vodDur); t.style.left=e.clientX+'px'; t.style.top=(r.top-9)+'px'; t.style.display='block'; });
$('seek').addEventListener('mouseleave',()=>{ $('seekTip').style.display='none'; });
function commitSeek(absSec){ if(!curFilm||!vodDur)return; absSec=Math.max(0,Math.min(vodDur-1,absSec));
  const bufEnd=V.buffered.length?vodBase+V.buffered.end(V.buffered.length-1):vodBase;
  if(absSec>=vodBase && absSec<=bufEnd){ V.currentTime=absSec-vodBase; saveState(); return; }  // 缓冲内:精确无缝
  // 缓冲外:整数百分点重取。前进时保证新起点严格晚于当前位置,绝不后退(整数粒度下宁可多进一点也不倒退)
  const curAbs=vodBase+V.currentTime; let pct=Math.round(absSec/vodDur*100);
  if(absSec>curAbs){ while(pct/100*vodDur<=curAbs+1 && pct<96) pct++; }
  playEpisode(Math.max(0,Math.min(96,pct))); saveState(); }
let seekTarget=null, seekTimer=null;
function seekBy(delta){ if(isLiveNow||!curFilm||!vodDur)return; flashUI();
  const base=(seekTarget!=null)?seekTarget:(vodBase+V.currentTime);
  seekTarget=Math.max(0,Math.min(vodDur-1,base+delta));
  dragging=true; $('seek').value=seekTarget; $('curT').textContent=fmt(seekTarget); updateSeekBar();  // 立即视觉反馈,先不取流
  clearTimeout(seekTimer); seekTimer=setTimeout(()=>{ const t=seekTarget; seekTarget=null; dragging=false; commitSeek(t); },280); }

document.addEventListener('keydown',e=>{
  const t=document.activeElement; if(t&&(t.tagName==='INPUT'||t.tagName==='SELECT'||t.tagName==='TEXTAREA'))return;
  if(e.code==='Escape'){
    if($('detail').classList.contains('show')){ closeDetail(); e.preventDefault(); return; }   // ESC 关选集,等同点✕
    if($('moreMenu').classList.contains('show')){ $('moreMenu').classList.remove('show'); e.preventDefault(); return; }
  }

  else if(e.code==='ArrowLeft'){ e.preventDefault(); seekBy(-15); }

  else if(e.code==='ArrowUp'){ e.preventDefault(); setVol(0.05); }

// —— 恢复策略(对齐原生App):临时卡顿不重取,让它自己缓冲恢复;
//    真结束(tell=2)自动下一集;真断流(ffmpeg退出)才从当前位置重取。 ——
let recovering=false, recoverTimes=0, lastRecover=0, recoverTimer=null, lastRecoverPos=-1;
function cancelRecovery(){ if(recoverTimer){clearTimeout(recoverTimer);recoverTimer=null;} recovering=false; }
function atEnd(){ if(!curFilm) return;   // 内容真结束:有下一集就自动切,否则显示播放结束
  if(curEpIdx<curEps.length-1){ curEpIdx++; playEpisode(resumePctFor(curFilm.playid,curEpIdx)); }
  else { $('loadtx').textContent='播放结束'; $('load').classList.add('show'); if(player){try{player.destroy()}catch(e){}player=null;} } }
function doRecover(){   // 断流/解码错误:先从当前位置重取续播;只有确认真到片尾才跳下一集(不再一到90%就跳)
  if(recovering||!player) return;
  if(!isLiveNow && curFilm && vodDur){ const vpos=vodBase+V.currentTime;
    if(vpos >= vodDur*0.98){ lastRecoverPos=-1; atEnd(); return; }                                   // 已到98%,基本到头 -> 下一集
    if(vpos >= vodDur*0.85 && lastRecoverPos>=0 && vpos <= lastRecoverPos+4){ lastRecoverPos=-1; atEnd(); return; }  // 片尾区重取后没往前(真没内容了) -> 下一集
    lastRecoverPos = vpos;                                                                            // 记下这次断流位置;重取后若没进展就判真结束
  } else { lastRecoverPos=-1; }
  const now=Date.now(); recoverTimes=(now-lastRecover<30000)?recoverTimes+1:1; lastRecover=now;
  if(recoverTimes>5){
    if(!isLiveNow && curFilm && vodDur && (vodBase+V.currentTime)>=vodDur*0.85){ recoverTimes=0; lastRecoverPos=-1; atEnd(); return; }  // 片尾区反复取不到=真到头,自动下一集(不弹"播放中断")
    $('loadtx').textContent='播放中断，请重选节目'; $('load').classList.add('show'); if(player){try{player.destroy()}catch(e){}player=null;} return; }
  recovering=true; $('load').classList.add('show'); $('loadtx').textContent='恢复中…';
  const pos = isLiveNow ? 0 : (vodBase + V.currentTime);
  recoverTimer=setTimeout(()=>{ recoverTimer=null; try{
    if(isLiveNow){ startPlay(window.playTitle||$('ptitle').textContent, window.curUrl, true); }
    else if(curFilm){ playEpisode(vodDur?Math.max(curPct,Math.min(96,Math.floor(pos/vodDur*100))):0); }
  }catch(e){} recovering=false; }, 600);
}
V.addEventListener('error', ()=>{ if(!recovering && !switching) doRecover(); });   // 真解码错误(罕见);切流期间不误触发
V.addEventListener('ended', ()=>{   // 点播"结束":到真片尾(>=98%)才下一集;中途就结束=源提前EOF/断流,从当前位置重取续播,别锁死在原地循环那几秒
  if(isLiveNow||!curFilm||!vodDur||recovering||switching) return;
  if((vodBase+V.currentTime) >= vodDur*0.98) atEnd(); else doRecover(); });
// 卡顿看门狗:进度冻结且无数据(readyState<3)约12秒 -> 查 streamstate 决定怎么办
let wdLast=0, wdStall=0, checking=false;
setInterval(async ()=>{
  if(!player||recovering){ wdStall=0; wdLast=V.currentTime; return; }
  const absPos = vodBase + V.currentTime;
  const nearEnd = curFilm && vodDur && absPos >= vodDur*0.98;   // 只有到98%才算"基本到头";90-98%的断流先重取续播(见doRecover),不再直接跳下一集
  if(V.paused){   // 暂停:只在"停在缓冲末尾且近片尾+流已断"时判真结束(否则是用户主动暂停,不动)
    const bufEnd = V.buffered.length ? V.buffered.end(V.buffered.length-1) : 0;
    if(nearEnd && curFilm && V.currentTime>=bufEnd-1.0 && !checking){ checking=true;
      try{ const st=await jget('/api/streamstate'); if(!st.alive) atEnd(); }catch(e){} checking=false; }
    wdStall=0; wdLast=V.currentTime; return;
  }
  const frozen = Math.abs(V.currentTime-wdLast)<0.1; wdLast=V.currentTime;
  if(frozen && V.readyState<3){ wdStall++; } else { wdStall=0; }
  if(wdStall>=4 && !checking){ wdStall=0; checking=true;
    try{ const st=await jget('/api/streamstate');
      if(st.ended && curFilm){ atEnd(); }                 // 原生 tell==2(若触发)
      else if(!st.alive){ if(nearEnd && curFilm) atEnd(); else doRecover(); }   // 断流:近尾=放完(下一集/结束),中途=重取
      // alive 且未结束 = 临时卡顿 = 不动,等缓冲自愈
    }catch(e){} checking=false;
  }
}, 3000);
V.addEventListener('waiting', ()=>{ if(player&&!recovering){ $('loadtx').textContent='缓冲中…'; $('load').classList.add('show'); } });
V.addEventListener('playing', ()=>{ $('load').classList.remove('show'); wdStall=0; });   // 不在这清 recoverTimes(会被"每次只播几秒的重取循环"绕过);改由 timeupdate 按真实进展清

// —— 人声增强(Web Audio 动态范围压缩) ——
let audioCtx=null, srcNode=null, compNode=null, gainNode=null, audioReady=false;
let dialogMode = LS.get('txtv_dialog', true); // 默认开启,只做选择性关闭
function setupAudio(){ if(audioCtx)return true;
  try{ audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    srcNode=audioCtx.createMediaElementSource(V); compNode=audioCtx.createDynamicsCompressor(); gainNode=audioCtx.createGain();
    routeAudio(); return true; }catch(e){ console.warn('audio setup fail',e); return false; } }
function routeAudio(){ if(!audioCtx)return;
  try{ srcNode.disconnect(); compNode.disconnect(); gainNode.disconnect(); }catch(e){}
  if(dialogMode){ compNode.threshold.value=-45; compNode.knee.value=30; compNode.ratio.value=12; compNode.attack.value=0.003; compNode.release.value=0.25; gainNode.gain.value=1.7;
    srcNode.connect(compNode); compNode.connect(gainNode); gainNode.connect(audioCtx.destination); }
  else { srcNode.connect(audioCtx.destination); } }
// 首次用户交互时初始化音频(浏览器策略要求手势),默认按 dialogMode 生效
function initAudioOnce(){ if(audioReady)return; audioReady=true; setupAudio(); if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume(); }
document.addEventListener('click', initAudioOnce, {once:true, capture:true});
document.addEventListener('keydown', initAudioOnce, {once:true, capture:true});
function toggleDialog(){ if(!setupAudio())return; if(audioCtx.state==='suspended')audioCtx.resume(); dialogMode=!dialogMode; routeAudio(); LS.set('txtv_dialog',dialogMode); $('mDialog').classList.toggle('on',dialogMode); }
$('moreBtn').onclick=(e)=>{ e.stopPropagation(); $('mDialog').classList.toggle('on',dialogMode); $('moreMenu').classList.toggle('show'); };
$('moreMenu').addEventListener('click',e=>e.stopPropagation());
document.addEventListener('click',()=>$('moreMenu').classList.remove('show'));

function startHeartbeat(){ setInterval(()=>{ if(!document.hidden && player) fetch('/api/heartbeat',{method:'POST'}).catch(()=>{}); },20000); }
// 点播播放时每2秒上报缓冲深度,供服务端反馈节流控制深缓冲上限
setInterval(()=>{ if(player && !isLiveNow && curFilm && !V.paused){ const a=V.buffered.length?(V.buffered.end(V.buffered.length-1)-V.currentTime):0; fetch('/api/buf?d='+a.toFixed(1)).catch(()=>{}); } }, 2000);  // 有播放器(观看会话中,含暂停)就保活;暂停/浏览空闲则由空闲定时器回收
window.addEventListener('pagehide',()=>{ saveState(); navigator.sendBeacon('/api/leave'); });
boot();
</script>
</body></html>

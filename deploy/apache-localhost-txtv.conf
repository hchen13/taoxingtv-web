# 本机无端口入口；Node 服务仍运行在 127.0.0.1:8090。
# 安装到 /etc/apache2/other/taoxingtv.conf 前，需启用 mod_proxy 和 mod_proxy_http。
<VirtualHost 127.0.0.1:80 [::1]:80>
    ServerName localhost
    ProxyRequests Off
    RedirectMatch 308 ^/TXTV$ /TXTV/
    ProxyPass /TXTV/ http://127.0.0.1:8090/TXTV/
    ProxyPassReverse /TXTV/ http://127.0.0.1:8090/TXTV/
</VirtualHost>
